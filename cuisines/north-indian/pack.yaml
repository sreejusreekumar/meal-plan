rules:
  - title: Plate order
    text: Sabzi or salad first, then dal or the protein, then one or two phulkas or a measured cup of brown basmati last.
  - title: Walk after meals
    text: 10–15 minutes of brisk walking right after lunch and dinner.
  - title: Fat is measured
    text: Ghee or oil is 1 teaspoon per dish; no cream in gravies, use yoghurt or cashew in small amounts.
  - title: Skip completely
    text: Naan, puri, bhature, deep-fried pakora, sweetened chai and mithai.
