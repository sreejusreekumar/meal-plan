steps:
  - "Soak the green gram overnight, drain and leave in a covered sieve for a day to sprout (or use sprouts from the fridge)."
  - "Slash the chicken pieces to the bone. Mix half the yoghurt with crushed ginger and garlic, kashmiri chilli, garam masala, coriander powder, toasted crushed cumin, turmeric, kasuri methi, half the lemon juice, the oil and salt; rub into the chicken and marinate at least 2 hours, ideally overnight."
  - "Heat the oven to 230 C. Roast the chicken on a rack over a tray for 25-30 minutes, turning once, until charred at the edges and cooked through."
  - "Blend mint, coriander, green chilli, the remaining yoghurt and lemon with a pinch of salt for the chutney."
  - "Toss the salad leaves with onion rings, tomato, cucumber and the sprouts; sprinkle chaat masala."
  - "Cook one phulka on a hot tawa. Pack the chicken cold with the salad and a pot of chutney."
swaps:
  - { for: chicken (bone-in curry cut), use: "chicken breast", note: 150 g; roast 18 minutes only }
source: "Adapted from the traditional Punjabi tandoori chicken"
