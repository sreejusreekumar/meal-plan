id: north-indian.breakfast.masala-oats-with-vegetables
name: Masala oats with vegetables & boiled egg
slot: [breakfast]
role: main
cuisine: north-indian
protein: egg
family: oats
tags: [quick]
spice: medium
kidNote: "Leave the green chilli whole so it can be lifted out of the child's bowl."
packable: false
prepMinutes: 10
cookMinutes: 15
effort: weekday
treat: false
refinedCarb: false
signature: false
nutrition: { kcal: 380, carbs: 45, fibre: 8, protein: 19, satFat: 3.5, sugar: 0 }
components:
  - "Primary: 1 bowl savoury masala oats with carrot, beans and peas"
  - "1 hard-boiled egg"
  - "Small bowl of low-fat curd"
ingredients:
  - { item: rolled oats, qty: 35, unit: g }
  - { item: carrot, qty: 0.5, unit: pc }
  - { item: french beans, qty: 30, unit: g }
  - { item: green peas (frozen), qty: 30, unit: g }
  - { item: onion, qty: 0.5, unit: pc }
  - { item: tomato, qty: 0.5, unit: pc }
  - { item: ginger, qty: 3, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc }
  - { item: cumin seeds, qty: 0.25, unit: tsp }
  - { item: turmeric powder, qty: 0.25, unit: tsp }
  - { item: curry leaves, qty: 1, unit: sprig }
  - { item: rice bran oil, qty: 1, unit: tsp }
  - { item: salt, qty: 0.5, unit: tsp }
  - { item: coriander leaves, qty: 0.15, unit: bunch }
  - { item: eggs, qty: 1, unit: pc }
  - { item: low-fat yoghurt (curd), qty: 100, unit: g }
steps:
  - "Put the egg on to hard-boil (10 minutes) while you cook the oats."
  - "Heat the oil, crackle the cumin and curry leaves, then saute the onion, ginger and whole green chilli until soft."
  - "Add the diced carrot, beans, peas, tomato, turmeric and salt with a splash of water; cover and cook 4 minutes."
  - "Stir in the oats and 1 cup of water; simmer 3-4 minutes until thick and creamy. Finish with coriander."
  - "Peel and halve the egg; serve on the oats with the curd alongside."
source: "Adapted from the savoury masala oats of north Indian home kitchens"
