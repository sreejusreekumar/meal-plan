  - { item: cumin seeds, qty: 0.25, unit: tsp }
  - { item: black tea leaves, qty: 1, unit: tsp }
steps:
  - "Whisk the besan with water to a pouring batter; stir in finely chopped onion, tomato, half the coriander, ajwain, turmeric and salt. Rest 5 minutes."
  - "Blend the mint, the rest of the coriander, lemon juice and roasted cumin into the curd for the chutney; season."
  - "Heat a non-stick tawa, brush with half the oil, pour a ladle of batter and spread thin; cook 2 minutes each side until golden. Repeat for the second chilla."
  - "Brew the tea leaves in water with a pinch of the ajwain for the chai if you like; no sugar, no milk needed."
  - "Serve the chillas hot with the chutney."
swaps:
  - { for: besan (chickpea flour), use: "yellow moong dal, soaked and ground", note: rest the batter 10 minutes }
