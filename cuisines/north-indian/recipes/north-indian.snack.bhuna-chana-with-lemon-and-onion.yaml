steps:
  - "Dry-roast the black chana in a heavy pan on medium-low heat 8-10 minutes until they crack and are crunchy (or use store-bought bhuna chana)."
  - "Toss the warm chana with finely chopped onion, tomato, coriander, chaat masala and half the lemon's juice."
  - "Brew the tea leaves in a cup of boiling water 2 minutes, strain and add the rest of the lemon juice; no sugar."
  - "Serve together."
