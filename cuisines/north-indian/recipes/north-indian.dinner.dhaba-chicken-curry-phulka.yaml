steps:
  - "Skin the chicken pieces and rub with half the turmeric and salt."
  - "Heat 1 tsp oil, add the black cardamom and bay leaf, crackle the cumin and fry the onion with ginger and garlic until deep brown, the dhaba way. Add the tomato with coriander, kashmiri chilli and remaining turmeric and cook until the oil separates."
  - "Add the chicken and sear 5 minutes. Whisk the yoghurt with 200 ml water, stir in over low heat with the green chilli, cover and simmer 25 minutes until the chicken is tender and the gravy clings. Finish with garam masala, kasuri methi, pepper and coriander leaves."
  - "Heat the remaining oil, add the shredded cabbage with a pinch of turmeric and salt, cover 5 minutes, then uncover and cook until just tender."
  - "Cook one phulka on a hot tawa. Serve the cabbage sabzi and cucumber first, then the chicken curry with the phulka."
swaps:
  - { for: chicken (bone-in curry cut), use: "chicken thigh (boneless)", note: 150 g; simmer 15 minutes }
source: "Adapted from the traditional Punjabi dhaba chicken curry"
