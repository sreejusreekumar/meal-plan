ingredients:
  - { item: makhana (foxnuts), qty: 20, unit: g }
  - { item: ghee, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.25, unit: tsp }
  - { item: black pepper, qty: 0.125, unit: tsp }
  - { item: salt, qty: 0.25, unit: tsp }
  - { item: almonds, qty: 10, unit: g }
  - { item: black tea leaves, qty: 1, unit: tsp }
  - { item: cardamom pods, qty: 1, unit: pc }
steps:
  - "Heat the ghee in a wide pan, add the makhana and roast on low 5-6 minutes, stirring, until crisp enough to snap."
  - "Sprinkle over turmeric, pepper and salt, add the almonds and toss 1 minute more."
  - "Boil a cup of water with the crushed cardamom, add the tea leaves, steep 2 minutes and strain; no sugar."
  - "Serve the warm makhana with the tea."
source: "Adapted from the traditional roasted makhana"
