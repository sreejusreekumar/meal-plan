rules:
  - title: Plate order
    text: "Herbs and raw vegetables first, then fish, chicken or tofu, then measured brown rice or brown rice noodles."
  - title: Walk after meals
    text: "10–15 minutes of brisk walking right after lunch and dinner."
  - title: Sugar is measured
    text: "Nuoc cham made with lime and fish sauce only; caramel sauces kept to 1 teaspoon sugar."
  - title: Skip completely
    text: "White rice, fried spring rolls, banh mi on white rolls and sweetened Vietnamese coffee."
