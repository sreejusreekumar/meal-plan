steps:
  - "Pat the tofu dry and cut into 1 cm slices; sear in a dry non-stick pan 3 minutes a side until golden."
  - "Mix the soy sauce with the finely grated ginger, sliced chilli, sliced spring onion and sesame oil."
  - "Spoon the dressing over the hot tofu and serve with cucumber slices."
  - "Brew the green tea."
