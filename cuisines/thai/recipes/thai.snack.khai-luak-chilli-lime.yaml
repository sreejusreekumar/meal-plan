id: thai.snack.khai-luak-chilli-lime
name: Boiled egg with chilli-lime and coriander (khai luak), cucumber, lemongrass tea
slot: [snack]
role: main
cuisine: thai
protein: egg
family: egg-snack
tags: [quick]
spice: mild
kidNote: "Dress the child's egg with lime only, no chilli."
packable: false
prepMinutes: 5
cookMinutes: 10
effort: weekday
treat: false
refinedCarb: false
signature: true
basedOn: "Khai luak, the Thai soft-boiled egg eaten with a spoon and seasoned at the table; here with a chilli-lime-fish-sauce dressing and coriander."
nutrition: { kcal: 140, carbs: 7, fibre: 2, protein: 9, satFat: 2, sugar: 0 }
components:
  - "Primary: 1 boiled egg with chilli, lime, fish sauce and coriander, a few crushed peanuts"
  - "Cucumber and cherry tomato slices"
  - "Hot lemongrass tea, unsweetened"
ingredients:
  - { item: eggs, qty: 1, unit: pc }
  - { item: red chilli (fresh), qty: 0.25, unit: pc }
  - { item: lime, qty: 0.25, unit: pc }
  - { item: fish sauce, qty: 0.5, unit: tsp }
  - { item: coriander leaves, qty: 0.1, unit: bunch }
  - { item: peanuts, qty: 8, unit: g }
  - { item: cucumber, qty: 0.5, unit: pc }
  - { item: cherry tomatoes, qty: 50, unit: g }
  - { item: black pepper, qty: 0.1, unit: tsp }
  - { item: lemongrass, qty: 1, unit: pc }
steps:
  - "Boil the egg 7 minutes (jammy) or 9 minutes (firm); cool, peel and halve."
  - "Mix the lime juice, fish sauce, finely chopped chilli and pepper; spoon over the egg and scatter coriander and crushed peanuts."
  - "Slice the cucumber and halve the cherry tomatoes to eat alongside."
  - "Bruise the lemongrass and steep in boiling water 5 minutes."
source: "Adapted from khai luak with a Thai chilli-lime dressing."
