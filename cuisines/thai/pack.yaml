rules:
  - title: Plate order
    text: "Greens or salad first, then the fish, chicken or tofu dish, then one level cup of brown jasmine rice last."
  - title: Walk after meals
    text: "10–15 minutes of brisk walking right after lunch and dinner."
  - title: Sugar and fat are measured
    text: "No palm sugar in sauces; thin coconut milk only; oil 1 teaspoon per stir-fry."
  - title: Skip completely
    text: "White rice, fried spring rolls, sweet Thai iced tea and sticky rice desserts."
