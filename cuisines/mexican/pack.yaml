rules:
  - title: Plate order
    text: "Salad or beans first, then the fish, chicken or egg dish, then one or two corn tortillas last."
  - title: Walk after meals
    text: "10–15 minutes of brisk walking right after lunch and dinner."
  - title: Fat is measured
    text: "Avocado a quarter per person; cheese a sprinkle; nothing deep-fried, tortilla chips baked."
  - title: Skip completely
    text: "Flour tortillas (white), refried beans in lard, sugary salsas and soft drinks."
