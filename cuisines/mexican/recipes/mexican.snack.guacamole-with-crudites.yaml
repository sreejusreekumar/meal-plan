id: mexican.snack.guacamole-with-crudites
name: Guacamole with capsicum and cucumber sticks, lime water
slot: [snack]
role: main
cuisine: mexican
protein: none
family: guacamole
tags: [quick]
spice: mild
packable: false
prepMinutes: 10
