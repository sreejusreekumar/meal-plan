id: mexican.snack.pepinos-con-chile
name: Cucumber and capsicum with chilli-lime, peanuts and black tea
slot: [snack]
role: main
cuisine: mexican
protein: none
family: cucumber
tags: [quick]
spice: mild
kidNote: "Dress the child's cucumber with lime and salt only, no chilli powder."
packable: false
prepMinutes: 8
