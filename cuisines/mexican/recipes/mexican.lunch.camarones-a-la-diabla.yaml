id: mexican.lunch.camarones-a-la-diabla
name: Camarones a la diabla (chilli prawns) with brown rice & salad
slot: [lunch]
role: main
cuisine: mexican
protein: fish
family: diabla
tags: [quick]
spice: medium
kidNote: "Hold back a few prawns and cook them in the plain tomato-garlic base before the chipotle and dried chilli go in."
packable: true
