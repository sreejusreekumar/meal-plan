steps:
  - "Warm the olive oil in a small frying pan, soften the diced capsicum and sliced garlic for 4 minutes, then add the crushed cumin seeds, paprika and chilli flakes."
  - "Add the chopped tomato with a splash of water and salt; simmer 6-8 minutes until thick and saucy."
  - "Make two hollows, crack in the eggs, cover and cook 4-5 minutes until the whites are set and the yolks still soft."
  - "Warm the pita in a dry pan, scatter parsley over the eggs and brew the tea without sugar."
source: "Adapted from the traditional Levantine shakshuka"
