id: middle-eastern.lunch.mujadara
name: Mujadara (lentils & bulgur with caramelised onion) with yoghurt & salad
slot: [lunch]
role: main
cuisine: middle-eastern
protein: legume
family: mujadara
spice: medium
packable: true
prepMinutes: 10
