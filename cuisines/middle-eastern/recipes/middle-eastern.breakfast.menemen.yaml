steps:
  - "Heat the olive oil in a small pan and soften the finely diced capsicum for 4 minutes."
  - "Add the grated or finely chopped tomato with salt and cook 5 minutes until it collapses into a thick sauce."
  - "Pour in the beaten eggs, season with pepper and chilli flakes and stir gently over low heat until just set and creamy."
  - "Scatter with parsley and serve with the toasted wholemeal bread and unsweetened black tea."
source: "Adapted from the traditional Turkish menemen"
