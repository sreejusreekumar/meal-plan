ingredients:
  - { item: capsicum, qty: 0.5, unit: pc }
  - { item: walnuts, qty: 12, unit: g }
  - { item: wholemeal bread, qty: 0.5, unit: pc }
  - { item: garlic, qty: 2, unit: g }
