steps:
  - "Grill the capsicum half under a hot grill or over a gas flame until blistered (about 10 minutes), then peel off the skin."
  - "Blend the capsicum with the walnuts, torn wholemeal bread, garlic, crushed cumin, paprika, lemon juice, olive oil and salt to a coarse paste."
  - "Cut the cucumber into sticks and serve alongside; brew the black tea unsweetened."
swaps:
  - { for: walnuts, use: almonds, note: same weight }
source: "Adapted from the traditional Syrian muhammara (lemon in place of pomegranate molasses)"
