id: middle-eastern.breakfast.ispanakli-yumurta
name: Turkish egg & spinach (ispanakli yumurta) with yoghurt
slot: [breakfast]
role: main
cuisine: middle-eastern
protein: egg
family: spinach-eggs
tags: [quick]
spice: medium
kidNote: "Leave the chilli flakes off the child's egg; sprinkle on the adults' plates at the table."
packable: false
