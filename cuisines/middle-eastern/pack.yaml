rules:
  - title: Plate order
    text: "Salad or mezze first, then the protein, then one wholemeal pita or a measured cup of freekeh, bulgur or brown rice."
  - title: Walk after meals
    text: "10–15 minutes of brisk walking right after lunch and dinner."
  - title: Fat is measured
    text: "Olive oil 1 teaspoon per dish; tahini 1 tablespoon; halloumi and nuts in small amounts."
  - title: Skip completely
    text: "White pita, fried falafel, baklava, sweetened tea and sugary pomegranate drinks."
