basedOn: "Tzatziki, the Greek dip of strained yoghurt, grated cucumber, garlic and dill."
nutrition: { kcal: 137, carbs: 15, fibre: 3, protein: 8, satFat: 1, sugar: 0 }
components:
  - "Small bowl of tzatziki (yoghurt, cucumber, dill, garlic)"
  - "Carrot and capsicum sticks for dipping"
  - "Green tea (unsweetened)"
ingredients:
  - { item: low-fat yoghurt (curd), qty: 120, unit: g }
  - { item: cucumber, qty: 0.25, unit: pc }
  - { item: garlic, qty: 2, unit: g }
  - { item: dill, qty: 0.1, unit: bunch }
  - { item: lemon, qty: 0.25, unit: pc }
  - { item: extra virgin olive oil, qty: 0.5, unit: tsp }
