id: mediterranean.dinner.chicken-capsicum-couscous
name: Grilled chicken with roasted capsicum & wholemeal couscous
slot: [dinner]
role: main
cuisine: mediterranean
protein: chicken
family: chicken-couscous
tags: [quick]
spice: mild
packable: false
