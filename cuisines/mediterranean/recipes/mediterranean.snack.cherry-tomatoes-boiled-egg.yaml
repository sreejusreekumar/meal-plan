nutrition: { kcal: 160, carbs: 11, fibre: 3, protein: 9, satFat: 2, sugar: 0 }
components:
  - "1 boiled egg, halved, with cherry tomatoes, oregano, pepper and a thread of olive oil"
  - "Half a slice of wholemeal toast"
  - "Green tea (unsweetened)"
ingredients:
  - { item: eggs, qty: 1, unit: pc }
  - { item: cherry tomatoes, qty: 120, unit: g }
  - { item: dried oregano, qty: 0.25, unit: tsp }
  - { item: extra virgin olive oil, qty: 0.5, unit: tsp }
  - { item: wholemeal bread, qty: 0.5, unit: pc }
  - { item: salt, qty: 0.1, unit: tsp }
  - { item: black pepper, qty: 0.1, unit: tsp }
