id: mediterranean.lunch.tuna-white-bean-salad
name: Tuna & white bean salad with cos lettuce
slot: [lunch]
role: main
cuisine: mediterranean
protein: fish
family: tuna-beans
tags: [quick]
spice: mild
packable: true
prepMinutes: 15
cookMinutes: 0
effort: weekday
treat: false
refinedCarb: false
signature: false
nutrition: { kcal: 510, carbs: 56, fibre: 14, protein: 40, satFat: 1, sugar: 0 }
components:
  - "Primary: Tuscan-style salad of canned tuna, cannellini beans, red onion, celery, capers and parsley"
  - "Cos lettuce leaves and cherry tomatoes"
  - "1 wholemeal pita"
ingredients:
  - { item: tuna (canned in springwater), qty: 95, unit: g }
  - { item: cannellini beans, qty: 45, unit: g }
  - { item: cos lettuce, qty: 0.25, unit: pc }
  - { item: cherry tomatoes, qty: 80, unit: g }
  - { item: red onion, qty: 0.25, unit: pc }
  - { item: celery, qty: 0.5, unit: pc }
  - { item: olives, qty: 15, unit: g }
  - { item: capers, qty: 1, unit: tsp }
  - { item: parsley, qty: 0.1, unit: bunch }
  - { item: lemon, qty: 0.25, unit: pc }
  - { item: extra virgin olive oil, qty: 1, unit: tsp }
  - { item: red wine vinegar, qty: 1, unit: tsp }
  - { item: wholemeal pita, qty: 1, unit: pc }
  - { item: salt, qty: 0.25, unit: tsp }
  - { item: black pepper, qty: 0.25, unit: tsp }
steps:
  - "Use cannellini beans cooked from the week's batch (45 g dry, soaked and boiled until tender); drain and cool."
  - "Sliver the red onion and soak in the red wine vinegar 5 minutes to soften; dice the celery."
  - "Flake the drained tuna into the beans with the onion, celery, capers, olives, parsley, olive oil, lemon juice, pepper and a little salt."
  - "Serve on cos lettuce leaves with the halved cherry tomatoes and the pita. Travels well; the leaves go in whole."
swaps:
  - { for: cannellini beans, use: white chickpeas (chana) }
source: "Adapted from the Tuscan tonno e fagioli"
