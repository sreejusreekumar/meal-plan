rules:
  - title: Plate order
    text: "Kimchi and namul first, then the stew, fish or tofu, then a small bowl of brown rice last."
  - title: Walk after meals
    text: "10–15 minutes of brisk walking right after lunch and dinner."
  - title: Sauce is measured
    text: "Gochujang and soy 1 teaspoon per person; no sugar or corn syrup in marinades, nashi pear instead."
  - title: Skip completely
    text: "White rice, fried chicken, tteokbokki on weekdays, instant noodles and sweetened drinks."
