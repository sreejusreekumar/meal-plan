id: korean.snack.kimchi-and-tofu
name: Kimchi with Warm Tofu Cubes & Green Tea
slot: [snack]
role: main
cuisine: korean
protein: legume
family: kimchi-tofu
tags: [quick]
spice: mild
kidNote: "Rinse the child's kimchi under the tap, or give them the tofu with cucumber and a dab of soy instead."
packable: true
prepMinutes: 5
