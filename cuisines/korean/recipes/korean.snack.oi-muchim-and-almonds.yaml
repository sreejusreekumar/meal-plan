id: korean.snack.oi-muchim-and-almonds
name: Oi Muchim (spicy cucumber salad) with Almonds & Green Tea
slot: [snack]
role: main
cuisine: korean
protein: none
family: oi-muchim
tags: [quick]
spice: mild
kidNote: "Dress the child's cucumber with vinegar, sesame and salt only; leave out the gochugaru."
packable: true
prepMinutes: 10
cookMinutes: 0
effort: weekday
treat: false
refinedCarb: false
signature: true
basedOn: "Oi muchim, the quick Korean cucumber salad tossed with gochugaru, garlic, vinegar and sesame."
nutrition: { kcal: 157, carbs: 6, fibre: 4, protein: 6, satFat: 1, sugar: 0 }
components:
  - "Primary: oi muchim (cucumber tossed with a little gochugaru, garlic, rice vinegar and sesame)"
  - "Almonds (20 g)"
  - "Green tea, unsweetened"
ingredients:
  - { item: cucumber, qty: 0.75, unit: pc }
  - { item: gochugaru (korean chilli flakes), qty: 0.25, unit: tsp }
  - { item: garlic, qty: 2, unit: g }
  - { item: rice vinegar, qty: 1, unit: tsp }
  - { item: soy sauce (low-sodium), qty: 0.5, unit: tsp }
  - { item: sesame oil, qty: 0.25, unit: tsp }
  - { item: sesame seeds, qty: 0.5, unit: tsp }
  - { item: spring onion, qty: 0.1, unit: bunch }
  - { item: almonds, qty: 20, unit: g }
  - { item: green tea bags, qty: 1, unit: pc }
steps:
  - "Cut the cucumber into half-moons and toss with a pinch of salt; leave 5 minutes and drain the water off."
  - "Mix the gochugaru, crushed garlic, rice vinegar, soy sauce and sesame oil; toss through the cucumber with the sesame seeds and sliced spring onion."
  - "Brew the green tea for 2 minutes."
  - "Serve the salad with a small handful of almonds and the tea."
swaps:
  - { for: almonds, use: "walnuts", note: "same weight" }
source: "Adapted from the traditional oi muchim"
