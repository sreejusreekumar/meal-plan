nutrition: { kcal: 152, carbs: 20, fibre: 5, protein: 4, satFat: 0, sugar: 0 }
components:
  - "Primary: half a small roasted sweet potato (gun goguma, about 100 g), eaten from the skin"
  - "Kimchi (40 g) and almonds (10 g)"
  - "Roasted barley tea (boricha)"
ingredients:
  - { item: sweet potato, qty: 0.5, unit: pc }
  - { item: kimchi, qty: 40, unit: g }
  - { item: almonds, qty: 10, unit: g }
  - { item: roasted barley tea bags, qty: 1, unit: pc }
steps:
  - "Scrub and halve a small sweet potato; prick the skin."
  - "Roast in an air fryer or hot oven (220 C) for about 15 minutes until the flesh is soft and the cut side caramelised (or microwave 4 minutes, then crisp 5 minutes in the oven)."
  - "Steep the barley tea bag in hot water."
  - "Serve the sweet potato in its skin, Korean street-stall style, with a spoon of kimchi and the almonds alongside."
swaps:
  - { for: almonds, use: "walnuts", note: "same weight" }
source: "Adapted from the Korean winter street snack gun goguma"
