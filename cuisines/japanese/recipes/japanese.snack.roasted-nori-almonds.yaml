basedOn: "Yaki nori, Japanese roasted seaweed sheets lightly brushed with sesame oil and salt, eaten as a crisp snack."
nutrition: { kcal: 146, carbs: 4, fibre: 4, protein: 6, satFat: 1, sugar: 0 }
components:
  - "Primary: 2 sheets roasted nori, cut into crisps, with sesame oil and salt"
