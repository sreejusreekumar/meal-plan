components:
  - "Primary: 1 cup miso soup with tofu, wakame, shiitake and spring onion"
  - "Roasted barley tea (mugicha)"
ingredients:
  - { item: kombu, qty: 2, unit: g }
  - { item: bonito flakes, qty: 2, unit: g }
  - { item: miso paste, qty: 1, unit: tbsp }
  - { item: tofu (firm), qty: 60, unit: g }
  - { item: wakame (dried), qty: 2, unit: g }
  - { item: shiitake mushrooms, qty: 20, unit: g }
  - { item: spring onion, qty: 0.1, unit: bunch }
  - { item: roasted barley tea bags, qty: 1, unit: pc }
steps:
  - "Make dashi: steep the kombu in 250 ml water, bring almost to the boil, remove it, add the bonito flakes, rest 2 minutes and strain."
  - "Simmer the sliced shiitake in the dashi 3 minutes; add the cubed tofu and wakame for 2 minutes more."
  - "Off the heat, dissolve the miso through a ladle and add sliced spring onion."
  - "Serve in a cup with a glass of barley tea."
source: "Adapted from the everyday Japanese tofu and wakame miso soup"
