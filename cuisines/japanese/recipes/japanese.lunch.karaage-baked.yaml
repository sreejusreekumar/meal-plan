id: japanese.lunch.karaage-baked
name: Baked Karaage-Style Chicken with Cabbage Salad & Brown Rice
slot: [lunch]
role: main
cuisine: japanese
protein: chicken
family: karaage
spice: mild
packable: true
prepMinutes: 15
cookMinutes: 25
effort: weekday
treat: false
