rules:
  - title: Plate order
    text: "Vegetables and miso soup first, then fish, tofu or chicken, then a small bowl of brown rice last."
  - title: Walk after meals
    text: "10–15 minutes of brisk walking right after lunch and dinner."
  - title: Salt and sugar are measured
    text: "Low-sodium soy, 1 teaspoon mirin at most, no sugar in teriyaki."
  - title: Skip completely
    text: "White rice, tempura, katsu, ramen and sweetened drinks."
