rules:
  - title: Plate order
    text: Thoran or mezhukkupuratti first, then fish, chicken or egg, then 1 cup matta rice last.
  - title: Walk after meals
    text: 10–15 minutes of brisk walking right after lunch and dinner.
  - title: Cooking fish
    text: No deep-fried meen porichathu. Kudampuli curry, pollichathu, or a tawa roast with 1 tsp coconut oil.
  - title: Skip completely
    text: Kappa, pazham pori, bakery snacks and sweetened tea.
