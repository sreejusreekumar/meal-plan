id: kerala.lunch.kalava-tawa-roast-and-murungayila
name: Kalava (Grouper) Tawa Roast & Murungayila
slot:
- lunch
role: main
cuisine: kerala
protein: fish
spice: medium
kidNote: Hold back the green chilli and chilli powder for the child's portion.
packable: true
effort: weekday
family: kalava
nutrition:
  kcal: 530
  carbs: 58
  fibre: 11
  protein: 36
  satFat: 3
  sugar: 0
components:
- 1 cup Murungayila thoran
- 'Primary: 150g Kalava fillet pan-seared with turmeric, pepper, and lime'
- 1 level cup Matta rice
- Tomato Rasam
swaps:
- for: Kalava
  use: Karimeen Tawa Roast
- for: Kalava
  use: Choora (Tuna) Steak
prepMinutes: 15
cookMinutes: 30
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: grouper (kalava) fillet, qty: 150, unit: g }
  - { item: turmeric powder, qty: 1, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: black pepper, qty: 1, unit: tsp }
  - { item: lime, qty: 0.25, unit: pc  }
  - { item: coconut oil, qty: 2.5, unit: tsp }
  - { item: curry leaves, qty: 3, unit: sprig }
  - { item: salt, qty: 1.5, unit: tsp }
  - { item: drumstick leaves (murungayila), qty: 0.4, unit: bunch  }
  - { item: shallots (small onions), qty: 20, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc  }
  - { item: mustard seeds, qty: 0.75, unit: tsp }
  - { item: grated coconut, qty: 15, unit: g }
  - { item: tomato, qty: 0.5, unit: pc  }
  - { item: tamarind, qty: 10, unit: g }
  - { item: garlic, qty: 4, unit: g   }
  - { item: cumin seeds, qty: 0.5, unit: tsp }
  - { item: coriander leaves, qty: 0.15, unit: bunch  }
  - { item: dried red chillies, qty: 1, unit: pc }
  - { item: asafoetida, qty: 0.1, unit: tsp }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Marinate the grouper fillet with turmeric, chilli powder, crushed pepper, lime juice and salt for 15 min.
  - Heat 1 tsp coconut oil on a tawa and sear the fish 4-5 min per side with curry leaves until the skin is crisp and the flesh flakes.
  - Strip and wash the leaves for the murungayila thoran; splutter mustard seeds and curry leaves in coconut oil, add shallots and green chilli, then the vegetable with turmeric and salt, cover and cook until just tender, and finish with grated coconut.
  - For the rasam, simmer tamarind water with crushed tomato, garlic, pepper, cumin, turmeric and salt (extra tomato) for 10 min, temper with mustard seeds, dried chilli and asafoetida, and add coriander leaves.
  - Plate 1 level cup rice with the murungayila thoran, the grouper fillet, and the rasam alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
