components:
- 1 cup Red Cheera thoran
- 'Primary: 1 whole Karimeen (Pearl Spot) roasted in banana leaf with spicy shallots'
- 1 level cup Matta rice
- Tomato Rasam
swaps:
- for: Karimeen
  use: Seer Fish (Neymeen) Pollichathu
- for: Karimeen
  use: Pomfret (Avoli) Pollichathu
prepMinutes: 25
cookMinutes: 45
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: pearl spot (karimeen), qty: 1, unit: pc }
  - { item: banana leaf, qty: 1, unit: pc }
  - { item: shallots (small onions), qty: 20, unit: g  }
  - { item: tomato, qty: 0.5, unit: pc  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: garlic, qty: 4, unit: g   }
  - { item: green chilli, qty: 0.5, unit: pc   }
  - { item: chilli powder, qty: 1, unit: tsp }
  - { item: kashmiri chilli powder, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 1, unit: tsp }
  - { item: black pepper, qty: 1, unit: tsp }
  - { item: coconut oil, qty: 3.5, unit: tsp }
  - { item: curry leaves, qty: 4, unit: sprig }
  - { item: lime, qty: 0.25, unit: pc  }
  - { item: salt, qty: 1.5, unit: tsp }
  - { item: amaranth leaves (cheera), qty: 0.5, unit: bunch  }
  - { item: mustard seeds, qty: 0.75, unit: tsp }
  - { item: grated coconut, qty: 15, unit: g }
  - { item: tamarind, qty: 10, unit: g }
  - { item: cumin seeds, qty: 0.5, unit: tsp }
  - { item: coriander leaves, qty: 0.15, unit: bunch  }
  - { item: dried red chillies, qty: 1, unit: pc }
  - { item: asafoetida, qty: 0.1, unit: tsp }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Score and marinate the pearl spot with turmeric, chilli powder, pepper, lime juice and salt, then sear briefly on both sides in 1 tsp coconut oil.
  - Fry shallots, ginger, garlic and green chilli in the remaining oil, add tomato, chilli powders and curry leaves and cook to a thick masala.
  - Wilt the banana leaf over a flame, spread masala on it, lay the fish on top, cover with more masala, wrap, and roast the parcel on a tawa 8-10 min per side.
  - Strip and wash the leaves for the cheera thoran; splutter mustard seeds and curry leaves in coconut oil, add shallots and green chilli, then the vegetable with turmeric and salt, cover and cook until just tender, and finish with grated coconut.
  - For the rasam, simmer tamarind water with crushed tomato, garlic, pepper, cumin, turmeric and salt (extra tomato) for 10 min, temper with mustard seeds, dried chilli and asafoetida, and add coriander leaves.
  - Plate 1 level cup rice with the cheera thoran, the pearl spot, and the rasam alongside.
