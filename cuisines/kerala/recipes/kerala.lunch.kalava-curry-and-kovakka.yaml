id: kerala.lunch.kalava-curry-and-kovakka
name: Kalava (Grouper) Curry & Kovakka
slot:
- lunch
role: main
cuisine: kerala
protein: fish
spice: medium
kidNote: Hold back the green chilli and chilli powder for the child's portion.
packable: true
effort: weekday
family: kalava
nutrition:
  kcal: 510
  carbs: 58
  fibre: 10
  protein: 35
  satFat: 3
  sugar: 0
components:
- 1 cup Kovakka mezhukkupuratti
- 'Primary: 1 portion Kalava (Reef Cod/Grouper) stewed with turmeric, ginger, and Kudampuli'
- 1 level cup Matta rice
- Pepper Rasam
swaps:
- for: Kalava
  use: Tilapia Tawa Roast
- for: Kalava
  use: White Avoli (Pomfret) Curry
prepMinutes: 20
cookMinutes: 35
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: grouper (kalava) fillet, qty: 150, unit: g }
  - { item: kudampuli (Malabar tamarind), qty: 1, unit: pc }
  - { item: shallots (small onions), qty: 20, unit: g  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: garlic, qty: 4, unit: g   }
  - { item: chilli powder, qty: 1, unit: tsp }
  - { item: kashmiri chilli powder, qty: 0.5, unit: tsp }
  - { item: fenugreek seeds, qty: 0.25, unit: tsp }
  - { item: turmeric powder, qty: 0.75, unit: tsp }
  - { item: coconut oil, qty: 2.5, unit: tsp }
  - { item: curry leaves, qty: 3, unit: sprig }
  - { item: salt, qty: 1.5, unit: tsp }
  - { item: ivy gourd (kovakka), qty: 100, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc  }
  - { item: mustard seeds, qty: 0.75, unit: tsp }
  - { item: tomato, qty: 0.5, unit: pc  }
  - { item: tamarind, qty: 10, unit: g }
  - { item: black pepper, qty: 1, unit: tsp }
  - { item: cumin seeds, qty: 0.5, unit: tsp }
  - { item: coriander leaves, qty: 0.15, unit: bunch  }
  - { item: dried red chillies, qty: 1, unit: pc }
  - { item: asafoetida, qty: 0.1, unit: tsp }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Clean the grouper fillet; soak the kudampuli in warm water and grind the chilli powders, turmeric and a little water to a paste.
  - Heat coconut oil in a clay pot, splutter fenugreek seeds, sauté shallots, ginger, garlic and curry leaves, add the chilli paste, the kudampuli with its water and salt, then slide in the fish and simmer 12-15 min until the gravy thickens.
  - Dice the vegetable finely for the kovakka mezhukkupuratti; splutter mustard seeds in coconut oil, add shallots, garlic and green chilli, then the vegetable with turmeric and salt, and stir-fry uncovered until tender and lightly browned.
  - For the rasam, simmer tamarind water with crushed tomato, garlic, pepper, cumin, turmeric and salt (extra black pepper) for 10 min, temper with mustard seeds, dried chilli and asafoetida, and add coriander leaves.
  - Plate 1 level cup rice with the kovakka mezhukkupuratti, the grouper fillet, and the rasam alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
