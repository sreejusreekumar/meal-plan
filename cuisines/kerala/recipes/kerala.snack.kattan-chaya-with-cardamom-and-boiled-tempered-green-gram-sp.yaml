ingredients:
  - { item: black tea leaves, qty: 1, unit: tsp }
  - { item: cardamom pods, qty: 1, unit: pc }
  - { item: green gram (cherupayar), qty: 30, unit: g }
  - { item: coconut oil, qty: 0.5, unit: tsp }
  - { item: mustard seeds, qty: 0.25, unit: tsp }
  - { item: curry leaves, qty: 1, unit: sprig }
  - { item: dried red chillies, qty: 1, unit: pc }
  - { item: salt, qty: 0.25, unit: tsp }
steps:
  - Boil a cup of water with a crushed cardamom pod, add the tea leaves, simmer 2 minutes and strain.
  - Steam the pre-sprouted green gram for 4 to 5 minutes until just tender.
  - Heat the coconut oil, pop the mustard seeds, add the curry leaves and dried red chilli, then toss in the sprouts with salt.
  - Serve warm with the tea.
