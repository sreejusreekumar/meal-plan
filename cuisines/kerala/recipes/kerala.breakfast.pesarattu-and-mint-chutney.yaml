id: kerala.breakfast.pesarattu-and-mint-chutney
name: Pesarattu & Mint Chutney
slot:
- breakfast
role: main
cuisine: kerala
protein: legume
spice: medium
packable: false
effort: weekday
family: dosa
prepMinutes: 15
cookMinutes: 15
nutrition:
  kcal: 360
  carbs: 35
  fibre: 9
  protein: 21
  satFat: 2.5
  sugar: 0
components:
- 2 whole moong pesarattus
- Mint-coriander dip
- 1 boiled egg
ingredients:
  - { item: green gram (cherupayar), qty: 50, unit: g }
  - { item: ginger, qty: 3, unit: g  }
  - { item: green chilli, qty: 0.5, unit: pc  }
  - { item: cumin seeds, qty: 0.25, unit: tsp }
  - { item: onion, qty: 0.25, unit: pc }
  - { item: salt, qty: 0.5, unit: tsp }
  - { item: rice bran oil, qty: 1, unit: tsp }
  - { item: mint leaves, qty: 0.25, unit: bunch }
  - { item: coriander leaves, qty: 0.15, unit: bunch  }
  - { item: low-fat yoghurt (curd), qty: 30, unit: g }
  - { item: lemon, qty: 0.25, unit: pc }
  - { item: eggs, qty: 1, unit: pc }
steps:
  - Grind the overnight-soaked whole green gram with ginger, green chilli, cumin and salt to a smooth batter.
  - Blend the mint and coriander with yoghurt, lemon juice and a pinch of salt into a quick dip.
  - Spread the batter thinly into 2 pesarattus on a hot tawa, top with chopped onion, drizzle oil and cook both sides.
  - Hard-boil the egg (10 minutes), peel and halve. Serve with the pesarattus and the mint dip.
