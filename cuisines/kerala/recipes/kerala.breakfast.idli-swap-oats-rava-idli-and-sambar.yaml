id: kerala.breakfast.idli-swap-oats-rava-idli-and-sambar
name: 'Idli Swap: Oats-Rava Idli & Sambar'
slot:
- breakfast
role: main
cuisine: kerala
protein: legume
spice: medium
packable: false
effort: weekday
family: idli
prepMinutes: 15
cookMinutes: 25
nutrition:
  kcal: 370
  carbs: 42
  fibre: 8
  protein: 19
  satFat: 3
  sugar: 0
components:
- 2-3 Oats-Ragi steamed idlis
- 1 bowl vegetable sambar
- 1 boiled egg
ingredients:
  - { item: rolled oats, qty: 35, unit: g }
  - { item: semolina (rava), qty: 20, unit: g }
  - { item: low-fat yoghurt (curd), qty: 40, unit: g }
  - { item: carrot, qty: 0.5, unit: pc }
  - { item: mustard seeds, qty: 0.25, unit: tsp }
  - { item: curry leaves, qty: 1, unit: sprig }
  - { item: toor dal, qty: 25, unit: g }
  - { item: french beans, qty: 30, unit: g }
  - { item: onion, qty: 0.5, unit: pc }
  - { item: tomato, qty: 0.5, unit: pc }
  - { item: tamarind, qty: 5, unit: g }
  - { item: coriander powder, qty: 1, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.25, unit: tsp }
  - { item: asafoetida, qty: 0.25, unit: tsp }
  - { item: coconut oil, qty: 1, unit: tsp }
  - { item: salt, qty: 0.5, unit: tsp }
  - { item: eggs, qty: 1, unit: pc }
steps:
  - Pressure-cook the toor dal with turmeric until soft and mash.
  - Dry-roast the oats and rava, grind the oats coarsely and mix both with yoghurt, grated carrot, salt and enough water to a thick batter; rest 10 minutes.
  - Simmer the diced onion, tomato, beans and half the carrot in tamarind water with coriander and chilli powders, then add the dal and cook 5 minutes.
  - Temper coconut oil with mustard seeds, curry leaves and asafoetida and pour over the sambar.
  - Steam the batter in greased idli plates for 10-12 minutes; makes 2-3 idlis.
  - Hard-boil the egg (10 minutes), peel and halve. Serve with the idlis and a bowl of sambar.
source: Kerala 28-day plan (index.html, Oct 2026)
