id: kerala.lunch.nadan-kozhi-stew-and-french-beans
name: Nadan Kozhi Stew & French Beans
slot:
- lunch
role: main
cuisine: kerala
protein: chicken
spice: medium
packable: true
effort: weekday
family: chicken-curry
signature: true
basedOn: "Kerala chicken stew in thin coconut milk with whole spices."
nutrition:
  kcal: 520
  carbs: 60
  fibre: 10
  protein: 37
  satFat: 5
  sugar: 0
components:
- 1 cup French beans mezhukkupuratti
- 1 bowl Nadan chicken stew cooked in thin coconut milk with ginger, carrots, and whole spices (No mutton)
- 1 level cup Matta rice
- Chilled Sambharam
prepMinutes: 20
cookMinutes: 40
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: chicken (bone-in curry cut), qty: 180, unit: g }
  - { item: onion, qty: 0.5, unit: pc  }
  - { item: carrot, qty: 0.5, unit: pc  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: green chilli, qty: 0.5, unit: pc   }
  - { item: black pepper, qty: 0.5, unit: tsp }
  - { item: cardamom pods, qty: 2, unit: pc }
  - { item: cloves, qty: 2, unit: pc }
  - { item: cinnamon stick, qty: 1, unit: pc }
  - { item: coconut milk (canned), qty: 80, unit: ml }
  - { item: coconut oil, qty: 2, unit: tsp }
  - { item: curry leaves, qty: 4, unit: sprig }
  - { item: salt, qty: 1.25, unit: tsp }
  - { item: french beans, qty: 100, unit: g }
  - { item: shallots (small onions), qty: 20, unit: g }
  - { item: mustard seeds, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.25, unit: tsp }
  - { item: garlic, qty: 4, unit: g  }
  - { item: low-fat yoghurt (curd), qty: 100, unit: g }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Sauté cardamom, cloves, cinnamon, onion, ginger and green chilli in coconut oil without browning.
  - Add the chicken, carrot, pepper, salt and 1.5 cups water, cook covered 25 min, then add the coconut milk and curry leaves and simmer gently 5 min.
  - Dice the vegetable finely for the french beans mezhukkupuratti; splutter mustard seeds in coconut oil, add shallots, garlic and green chilli, then the vegetable with turmeric and salt, and stir-fry uncovered until tender and lightly browned.
  - Whisk the yoghurt with water, crushed ginger, green chilli, curry leaves and salt to make the sambharam; chill until serving.
  - Plate 1 level cup rice with the french beans mezhukkupuratti, the chicken, and the sambharam alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
