  carbs: 57
  fibre: 10
  protein: 34
  satFat: 5
  sugar: 0
components:
- 1 cup Cheera thoran
- 'Primary: 1 medium Ayala shallow pan-seared'
- 1 level cup Matta rice
- Sambharam
swaps:
