steps:
  - Crush the curry leaves, ginger and green chilli with the cumin, then whisk into the yoghurt with 150 ml cold water and salt.
  - Dry-roast the almonds in a pan for 2 to 3 minutes until fragrant and let them cool.
  - Serve the almonds alongside the drink.
