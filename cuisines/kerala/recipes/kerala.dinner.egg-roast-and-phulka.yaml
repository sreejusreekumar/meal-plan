id: kerala.dinner.egg-roast-and-phulka
name: Egg Roast & Phulka
slot:
- dinner
role: main
cuisine: kerala
protein: egg
spice: medium
packable: false
effort: weekday
prepMinutes: 10
cookMinutes: 30
family: egg-roast
nutrition:
  kcal: 500
  carbs: 50
  fibre: 11
  protein: 27
  satFat: 4
  sugar: 0
components:
- 2 whole-wheat phulkas
- Muttai roast (2 eggs in shallot-tomato gravy)
- Steamed cauliflower florets
ingredients:
- { item: whole-wheat atta, qty: 70, unit: g }
- { item: eggs, qty: 2, unit: pc }
- { item: shallots (small onions), qty: 20, unit: g  }
- { item: tomato, qty: 0.5, unit: pc  }
- { item: green chilli, qty: 0.5, unit: pc  }
- { item: cauliflower, qty: 150, unit: g }
- { item: black pepper, qty: 0.25, unit: tsp }
- { item: ginger, qty: 3, unit: g  }
- { item: garlic, qty: 4, unit: g   }
- { item: kashmiri chilli powder, qty: 1, unit: tsp }
- { item: coriander powder, qty: 1, unit: tsp }
- { item: turmeric powder, qty: 0.5, unit: tsp }
- { item: garam masala, qty: 0.5, unit: tsp }
- { item: curry leaves, qty: 2, unit: sprig }
- { item: rice bran oil, qty: 1, unit: tsp }
- { item: salt, qty: 0.5, unit: tsp }
steps:
- Hard-boil the eggs, peel and slit them lightly.
- Heat the oil and fry the sliced shallots with ginger, garlic, green chilli and curry leaves until deep golden.
- Add kashmiri chilli, coriander and turmeric, then the chopped tomato; cook to a thick masala.
- Add the eggs and a splash of water, coat well, finish with garam masala and cook until dry.
- Steam the cauliflower florets 6 minutes and season with pepper and salt.
- Roll two phulkas, puff on the tawa and serve with the egg roast and cauliflower.
