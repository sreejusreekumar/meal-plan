ingredients:
  - { item: black tea leaves, qty: 1, unit: tsp }
  - { item: ginger, qty: 3, unit: g  }
  - { item: edamame (frozen), qty: 60, unit: g }
  - { item: salt, qty: 0.25, unit: tsp }
steps:
  - Crush the ginger, boil it in a cup of water for 2 minutes, add the tea leaves, simmer a minute and strain.
  - Boil the frozen edamame in salted water for 4 to 5 minutes, then drain.
  - Sprinkle with salt and serve warm with the tea (boiled chickpeas work as a swap).
