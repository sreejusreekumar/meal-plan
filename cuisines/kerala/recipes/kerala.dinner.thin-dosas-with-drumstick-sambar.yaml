id: kerala.dinner.thin-dosas-with-drumstick-sambar
name: Thin Dosas with Drumstick Sambar
slot:
- dinner
role: main
cuisine: kerala
protein: legume
spice: medium
packable: false
effort: weekday
prepMinutes: 15
cookMinutes: 35
family: dosa
nutrition:
  kcal: 500
  carbs: 48
  fibre: 11
  protein: 24
  satFat: 3
  sugar: 0
components:
- 2 thin whole-wheat dosas
- 1 bowl Sambar (heavy on drumstick, ash gourd, brinjal)
- 2 boiled egg whites
ingredients:
- { item: whole-wheat atta, qty: 60, unit: g }
- { item: eggs, qty: 2, unit: pc }
- { item: tomato, qty: 0.5, unit: pc  }
- { item: rice bran oil, qty: 1, unit: tsp }
- { item: toor dal, qty: 30, unit: g }
- { item: drumstick (moringa pods), qty: 1, unit: pc }
- { item: ash gourd, qty: 50, unit: g }
- { item: brinjal (eggplant), qty: 50, unit: g }
- { item: tamarind, qty: 10, unit: g }
- { item: shallots (small onions), qty: 20, unit: g }
- { item: coriander powder, qty: 1, unit: tsp }
- { item: chilli powder, qty: 0.5, unit: tsp }
- { item: turmeric powder, qty: 0.5, unit: tsp }
- { item: fenugreek seeds, qty: 0.25, unit: tsp }
- { item: mustard seeds, qty: 0.5, unit: tsp }
- { item: curry leaves, qty: 1, unit: sprig }
- { item: dried red chillies, qty: 1, unit: pc }
- { item: asafoetida, qty: 0.25, unit: tsp }
- { item: coconut oil, qty: 1, unit: tsp }
- { item: salt, qty: 0.5, unit: tsp }
steps:
- Whisk the atta with water and a pinch of salt to a thin pouring batter; rest 15 minutes.
- Pressure-cook the toor dal soft; soak the tamarind and squeeze out the pulp.
- Simmer the drumstick, ash gourd, brinjal and tomato in the tamarind water with coriander, chilli and turmeric until tender.
- Add the mashed dal and simmer 5 minutes; temper mustard, fenugreek, dried chilli, asafoetida, shallots and curry leaves in coconut oil and pour over.
- Hard-boil the eggs, peel and keep the whites.
- Spread two thin dosas on a hot tawa with a few drops of oil and serve with the sambar and egg whites.
source: Kerala 28-day plan (index.html, Oct 2026)
