id: kerala.dinner.cherupayar-puzhukku
name: Cherupayar Puzhukku (No Rice Dinner)
slot:
- dinner
role: main
cuisine: kerala
protein: legume
tags:
- no-rice
spice: medium
packable: false
effort: weekday
prepMinutes: 15
cookMinutes: 30
family: cherupayar
nutrition:
  kcal: 460
  carbs: 40
  fibre: 12
  protein: 29
  satFat: 4
  sugar: 0
components:
- 1.5 cups Cherupayar puzhukku with 1 tbsp fresh coconut
- 2 boiled egg whites
- Clear vegetable soup
ingredients:
- { item: green gram (cherupayar), qty: 60, unit: g }
- { item: grated coconut, qty: 10, unit: g }
- { item: eggs, qty: 2, unit: pc }
- { item: shallots (small onions), qty: 20, unit: g }
- { item: garlic, qty: 4, unit: g   }
- { item: green chilli, qty: 0.5, unit: pc  }
- { item: cumin seeds, qty: 0.5, unit: tsp }
- { item: turmeric powder, qty: 0.5, unit: tsp }
- { item: curry leaves, qty: 1, unit: sprig }
- { item: coconut oil, qty: 1, unit: tsp }
- { item: mustard seeds, qty: 0.5, unit: tsp }
- { item: carrot, qty: 0.5, unit: pc  }
- { item: french beans, qty: 50, unit: g }
- { item: cabbage, qty: 50, unit: g }
- { item: ginger, qty: 3, unit: g  }
- { item: black pepper, qty: 0.5, unit: tsp }
- { item: salt, qty: 0.5, unit: tsp }
steps:
- Pressure-cook the green gram with turmeric and salt until soft but still whole.
- Hard-boil the eggs, peel and keep only the whites.
- Crush the coconut with cumin, garlic and green chilli; stir into the gram and cook until dry.
- Temper mustard seeds, shallots and curry leaves in the coconut oil and fold into the puzhukku.
- Simmer the carrot, beans and cabbage with ginger and pepper in water for 10 minutes for a clear soup.
- Serve the puzhukku with the egg whites and a bowl of soup.
source: Kerala 28-day plan (index.html, Oct 2026)
