id: kerala.dinner.cherupayar-puzhukku-and-egg-whites
name: Cherupayar Puzhukku & Egg Whites
slot:
- dinner
role: main
cuisine: kerala
protein: legume
tags:
- no-rice
spice: medium
packable: false
effort: weekday
prepMinutes: 15
cookMinutes: 30
family: cherupayar
signature: true
basedOn: "Cherupayar puzhukku, green gram with coconut, the Thiruvathira-day dish."
nutrition:
  kcal: 500
  carbs: 42
  fibre: 12
  protein: 30
  satFat: 5
  sugar: 0
components:
- 1.5 cups Cherupayar puzhukku
- 2 hard-boiled egg whites
- Clear vegetable soup (No rice)
ingredients:
- { item: green gram (cherupayar), qty: 60, unit: g }
- { item: grated coconut, qty: 15, unit: g }
- { item: eggs, qty: 2, unit: pc }
- { item: shallots (small onions), qty: 20, unit: g }
- { item: garlic, qty: 4, unit: g   }
- { item: green chilli, qty: 0.5, unit: pc  }
- { item: cumin seeds, qty: 0.5, unit: tsp }
- { item: turmeric powder, qty: 0.5, unit: tsp }
- { item: curry leaves, qty: 1, unit: sprig }
- { item: coconut oil, qty: 1, unit: tsp }
- { item: mustard seeds, qty: 0.5, unit: tsp }
- { item: carrot, qty: 0.5, unit: pc  }
- { item: french beans, qty: 50, unit: g }
- { item: cabbage, qty: 50, unit: g }
- { item: ginger, qty: 3, unit: g  }
- { item: black pepper, qty: 0.5, unit: tsp }
- { item: salt, qty: 0.5, unit: tsp }
steps:
- Pressure-cook the green gram with turmeric and salt until soft but still whole.
- Hard-boil the eggs, peel and keep only the whites.
- Grind the coconut with cumin, garlic and green chilli to a coarse paste; stir it into the gram and cook until dry.
- Heat the coconut oil, pop the mustard seeds with the shallots and curry leaves and mix into the puzhukku.
- Simmer the diced carrot, beans and cabbage with ginger and pepper in 400 ml water for 10 minutes to make a clear soup.
- Serve the puzhukku with the egg whites and the soup; no rice.
source: Kerala 28-day plan (index.html, Oct 2026)
