ingredients:
  - { item: coffee powder, qty: 1, unit: tsp }
  - { item: cardamom pods, qty: 1, unit: pc }
  - { item: almonds, qty: 15, unit: g }
steps:
  - Boil a cup of water with a crushed cardamom pod, stir in the coffee powder, steep a minute and strain; no sugar.
  - Dry-roast the almonds in a pan for 2 to 3 minutes until fragrant.
  - Serve the warm almonds alongside the drink.
