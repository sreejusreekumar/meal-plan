id: kerala.lunch.pan-seared-ayala-and-pavakka-mezhukkupuratti
name: Pan-Seared Ayala & Pavakka Mezhukkupuratti
slot:
- lunch
role: main
cuisine: kerala
protein: fish
spice: medium
kidNote: Hold back the green chilli and chilli powder for the child's portion.
packable: true
effort: weekday
family: ayala
nutrition:
  kcal: 530
  carbs: 58
  fibre: 10
  protein: 34
  satFat: 5
  sugar: 0
components:
- 1 cup Pavakka (bitter gourd) mezhukkupuratti
- 'Primary: 1 medium Ayala (mackerel) pan-roasted in minimal oil'
- 1 level cup Matta rice
- Garlic-pepper Rasam
swaps:
- for: Ayala
  use: Karimeen (Pearl Spot) Tawa Roast
- for: Ayala
  use: Avoli (Black Pomfret) pan-seared with turmeric and pepper
prepMinutes: 15
cookMinutes: 30
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: mackerel (ayala), qty: 1, unit: pc }
  - { item: turmeric powder, qty: 1, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: black pepper, qty: 1.5, unit: tsp }
  - { item: lime, qty: 0.25, unit: pc  }
  - { item: coconut oil, qty: 2.5, unit: tsp }
  - { item: curry leaves, qty: 3, unit: sprig }
  - { item: salt, qty: 1.5, unit: tsp }
  - { item: bitter gourd (pavakka), qty: 100, unit: g }
  - { item: shallots (small onions), qty: 20, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc  }
  - { item: mustard seeds, qty: 0.75, unit: tsp }
  - { item: garlic, qty: 4, unit: g   }
  - { item: tomato, qty: 0.5, unit: pc  }
  - { item: tamarind, qty: 10, unit: g }
  - { item: cumin seeds, qty: 0.5, unit: tsp }
  - { item: coriander leaves, qty: 0.15, unit: bunch  }
  - { item: dried red chillies, qty: 1, unit: pc }
  - { item: asafoetida, qty: 0.1, unit: tsp }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Marinate the mackerel with turmeric, chilli powder, crushed pepper, lime juice and salt for 15 min.
  - Heat 1 tsp coconut oil on a tawa and sear the fish 4-5 min per side with curry leaves until the skin is crisp and the flesh flakes.
  - Dice the vegetable finely for the pavakka mezhukkupuratti; splutter mustard seeds in coconut oil, add shallots, garlic and green chilli, then the vegetable with turmeric and salt, and stir-fry uncovered until tender and lightly browned.
  - For the rasam, simmer tamarind water with crushed tomato, garlic, pepper, cumin, turmeric and salt (extra garlic and pepper) for 10 min, temper with mustard seeds, dried chilli and asafoetida, and add coriander leaves.
  - Plate 1 level cup rice with the pavakka mezhukkupuratti, the mackerel, and the rasam alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
