ingredients:
  - { item: coffee powder, qty: 1, unit: tsp }
  - { item: dry ginger powder (chukku), qty: 0.25, unit: tsp }
  - { item: pumpkin seeds, qty: 15, unit: g }
  - { item: salt, qty: 0.125, unit: tsp }
steps:
  - Boil a cup of water with the dry ginger powder, stir in the coffee powder, steep a minute and strain; no sugar.
  - Dry-roast the pumpkin seeds in a pan for 2 to 3 minutes until they start to pop.
  - Sprinkle with a pinch of salt and serve with the drink.
