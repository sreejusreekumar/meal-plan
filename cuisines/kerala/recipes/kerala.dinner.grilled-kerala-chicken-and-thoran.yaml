id: kerala.dinner.grilled-kerala-chicken-and-thoran
name: Grilled Kerala Chicken & Thoran
slot:
- dinner
role: main
cuisine: kerala
protein: chicken
spice: medium
packable: false
effort: weekday
prepMinutes: 20
cookMinutes: 25
family: grilled-chicken
nutrition:
  kcal: 510
  carbs: 36
  fibre: 9
  protein: 40
  satFat: 6
  sugar: 0
components:
- 150g boneless chicken breast marinated in nadan spices
- 1 cup Padavalanga (snake gourd) thoran
- 1 whole-wheat chapati
ingredients:
- { item: chicken breast, qty: 150, unit: g }
- { item: chilli powder, qty: 1, unit: tsp }
- { item: black pepper, qty: 0.5, unit: tsp }
- { item: coriander powder, qty: 1, unit: tsp }
- { item: garam masala, qty: 0.5, unit: tsp }
- { item: ginger, qty: 3, unit: g   }
- { item: garlic, qty: 4, unit: g   }
- { item: lime, qty: 0.25, unit: pc   }
- { item: rice bran oil, qty: 1, unit: tsp }
- { item: snake gourd (padavalanga), qty: 100, unit: g }
- { item: grated coconut, qty: 15, unit: g }
- { item: shallots (small onions), qty: 20, unit: g }
- { item: green chilli, qty: 0.5, unit: pc  }
- { item: cumin seeds, qty: 0.25, unit: tsp }
- { item: mustard seeds, qty: 0.5, unit: tsp }
- { item: curry leaves, qty: 1, unit: sprig }
- { item: turmeric powder, qty: 0.5, unit: tsp }
- { item: coconut oil, qty: 1, unit: tsp }
- { item: whole-wheat atta, qty: 35, unit: g }
- { item: salt, qty: 0.5, unit: tsp }
steps:
- Marinate the chicken with chilli powder, turmeric, pepper, coriander, garam masala, ginger, garlic, lime and salt for 15 minutes.
- Knead the atta, roll one chapati and cook on the tawa.
- Pop the mustard seeds in coconut oil, add the shallots and curry leaves, then the diced snake gourd and salt.
- Cover and cook 8 minutes, then stir in the coconut crushed with cumin and green chilli and cook dry.
- Pan-grill the chicken in the oil on medium heat about 6 minutes a side until cooked through.
- Rest the chicken, slice and serve with the thoran and chapati.
source: Kerala 28-day plan (index.html, Oct 2026)
