id: kerala.lunch.chicken-chukka-and-cheera-thoran
name: Chicken Chukka & Cheera Thoran
slot:
- lunch
role: main
cuisine: kerala
protein: chicken
spice: medium
kidNote: Hold back the green chilli and chilli powder for the child's portion.
packable: true
effort: weekday
family: chicken-roast
nutrition:
  kcal: 530
  carbs: 58
  fibre: 10
  protein: 40
  satFat: 4
  sugar: 0
components:
- 1 cup Cheera thoran
- 150g dry chicken chukka cooked with crushed black pepper, shallots, and curry leaves
- 1 level cup Matta rice
- Cumin Rasam
prepMinutes: 20
cookMinutes: 35
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: chicken breast, qty: 150, unit: g }
  - { item: shallots (small onions), qty: 20, unit: g  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: garlic, qty: 4, unit: g   }
  - { item: black pepper, qty: 1.5, unit: tsp }
  - { item: coriander powder, qty: 1, unit: tsp }
  - { item: garam masala, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.75, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: coconut oil, qty: 3, unit: tsp }
  - { item: curry leaves, qty: 4, unit: sprig }
  - { item: salt, qty: 1.5, unit: tsp }
  - { item: amaranth leaves (cheera), qty: 0.5, unit: bunch  }
  - { item: green chilli, qty: 0.5, unit: pc  }
  - { item: mustard seeds, qty: 0.75, unit: tsp }
  - { item: grated coconut, qty: 15, unit: g }
  - { item: tomato, qty: 0.5, unit: pc  }
  - { item: tamarind, qty: 10, unit: g }
  - { item: cumin seeds, qty: 1, unit: tsp }
  - { item: coriander leaves, qty: 0.15, unit: bunch  }
  - { item: dried red chillies, qty: 1, unit: pc }
  - { item: asafoetida, qty: 0.1, unit: tsp }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Marinate the chicken with turmeric, chilli powder, coriander powder and salt for 15 min.
  - Sauté shallots, ginger, garlic and curry leaves in coconut oil, add the chicken and cook covered 15 min, then uncover, add crushed black pepper and garam masala and roast until dry and dark.
  - Strip and wash the leaves for the cheera thoran; splutter mustard seeds and curry leaves in coconut oil, add shallots and green chilli, then the vegetable with turmeric and salt, cover and cook until just tender, and finish with grated coconut.
  - For the rasam, simmer tamarind water with crushed tomato, garlic, pepper, cumin, turmeric and salt (extra cumin) for 10 min, temper with mustard seeds, dried chilli and asafoetida, and add coriander leaves.
  - Plate 1 level cup rice with the cheera thoran, the chicken, and the rasam alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
