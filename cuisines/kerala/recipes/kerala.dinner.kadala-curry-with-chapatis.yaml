components:
- 2 whole-wheat chapatis
- 1 cup thick Kadala curry
- Mixed greens salad
ingredients:
- { item: whole-wheat atta, qty: 70, unit: g }
- { item: black chickpeas (kadala), qty: 50, unit: g }
- { item: onion, qty: 0.5, unit: pc  }
- { item: tomato, qty: 0.5, unit: pc  }
- { item: ginger, qty: 3, unit: g   }
- { item: garlic, qty: 4, unit: g   }
- { item: coriander powder, qty: 1.5, unit: tsp }
- { item: chilli powder, qty: 0.5, unit: tsp }
- { item: turmeric powder, qty: 0.5, unit: tsp }
- { item: garam masala, qty: 0.5, unit: tsp }
- { item: grated coconut, qty: 10, unit: g }
- { item: coconut oil, qty: 1, unit: tsp }
- { item: mustard seeds, qty: 0.5, unit: tsp }
- { item: curry leaves, qty: 1, unit: sprig }
- { item: dried red chillies, qty: 1, unit: pc }
- { item: salad leaves (mixed), qty: 50, unit: g }
- { item: cucumber, qty: 0.5, unit: pc  }
- { item: lime, qty: 0.25, unit: pc   }
- { item: salt, qty: 0.5, unit: tsp }
steps:
- Soak the black chickpeas overnight, then pressure-cook with turmeric and salt until soft.
- Heat the coconut oil, pop the mustard seeds with dried chilli and curry leaves, then fry the onion, ginger and garlic.
- Add coriander and chilli powder, the chopped tomato and cook to a thick masala.
- Add the cooked chickpeas with their water and simmer until thick; finish with the ground coconut and garam masala.
- Roll two chapatis and cook dry on a hot tawa.
- Toss the salad leaves and cucumber with lime juice and serve alongside.
