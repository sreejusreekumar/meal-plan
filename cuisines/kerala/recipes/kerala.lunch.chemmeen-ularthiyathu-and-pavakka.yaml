id: kerala.lunch.chemmeen-ularthiyathu-and-pavakka
name: Chemmeen Ularthiyathu & Pavakka
slot:
- lunch
role: main
cuisine: kerala
protein: fish
spice: medium
kidNote: Hold back the green chilli and chilli powder for the child's portion.
packable: true
effort: weekday
family: chemmeen
nutrition:
  kcal: 540
  carbs: 58
  fibre: 10
  protein: 36
  satFat: 3
  sugar: 0
components:
- 1 cup Pavakka mezhukkupuratti
- 'Primary: 150g Chemmeen (Prawns) sautéed with shallots, curry leaves, and cracked pepper'
- 1 level cup Matta rice
- Moru kachiyathu
swaps:
- for: Chemmeen
  use: Kallummakkaya (Mussels) Roast
- for: Chemmeen
  use: Ayala (Mackerel) Mulakittathu
prepMinutes: 20
cookMinutes: 30
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: prawns (chemmeen), qty: 150, unit: g }
  - { item: shallots (small onions), qty: 20, unit: g  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: garlic, qty: 4, unit: g   }
  - { item: black pepper, qty: 1, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.75, unit: tsp }
  - { item: coconut oil, qty: 3, unit: tsp }
  - { item: curry leaves, qty: 4, unit: sprig }
  - { item: salt, qty: 1.25, unit: tsp }
  - { item: bitter gourd (pavakka), qty: 100, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc   }
  - { item: mustard seeds, qty: 0.75, unit: tsp }
  - { item: low-fat yoghurt (curd), qty: 100, unit: g }
  - { item: fenugreek seeds, qty: 0.1, unit: tsp }
  - { item: dried red chillies, qty: 1, unit: pc }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Marinate the prawns with turmeric, chilli powder and salt.
  - Sauté shallots, ginger, garlic and curry leaves in coconut oil, add the prawns and crushed black pepper, and toss 5-6 min until dry and coated.
  - Dice the vegetable finely for the pavakka mezhukkupuratti; splutter mustard seeds in coconut oil, add shallots, garlic and green chilli, then the vegetable with turmeric and salt, and stir-fry uncovered until tender and lightly browned.
  - For the moru kachiyathu, whisk yoghurt with water and turmeric, warm gently without boiling, and temper with mustard seeds, fenugreek, shallots, ginger, green chilli, dried chilli and curry leaves.
  - Plate 1 level cup rice with the pavakka mezhukkupuratti, the prawns, and the moru kachiyathu alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
