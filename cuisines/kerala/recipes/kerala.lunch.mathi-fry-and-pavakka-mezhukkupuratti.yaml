ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: sardines (mathi), qty: 3, unit: pc }
  - { item: turmeric powder, qty: 0.75, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: black pepper, qty: 0.5, unit: tsp }
  - { item: lime, qty: 0.25, unit: pc  }
  - { item: coconut oil, qty: 2, unit: tsp }
  - { item: curry leaves, qty: 3, unit: sprig }
  - { item: salt, qty: 1.25, unit: tsp }
  - { item: bitter gourd (pavakka), qty: 100, unit: g }
  - { item: shallots (small onions), qty: 20, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc   }
  - { item: mustard seeds, qty: 0.5, unit: tsp }
  - { item: garlic, qty: 4, unit: g  }
  - { item: low-fat yoghurt (curd), qty: 100, unit: g }
  - { item: ginger, qty: 3, unit: g  }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Marinate the sardines with turmeric, chilli powder, crushed pepper, lime juice and salt for 15 min.
  - Heat 1 tsp coconut oil on a tawa and sear the fish 4-5 min per side with curry leaves until the skin is crisp and the flesh flakes.
  - Dice the vegetable finely for the pavakka mezhukkupuratti; splutter mustard seeds in coconut oil, add shallots, garlic and green chilli, then the vegetable with turmeric and salt, and stir-fry uncovered until tender and lightly browned.
  - Whisk the yoghurt with water, crushed ginger, green chilli, curry leaves and salt to make the sambharam; chill until serving.
  - Plate 1 level cup rice with the pavakka mezhukkupuratti, the sardines, and the sambharam alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
