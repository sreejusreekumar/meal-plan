id: kerala.dinner.chicken-tikka-wrap-in-chapati
name: Chicken Tikka Wrap in Chapati
slot:
- dinner
role: main
cuisine: kerala
protein: chicken
spice: medium
packable: false
effort: weekday
prepMinutes: 20
cookMinutes: 20
family: grilled-chicken
nutrition:
  kcal: 490
  carbs: 36
  fibre: 8
  protein: 40
  satFat: 3
  sugar: 0
components:
- 1 chapati rolled with spiced grilled chicken strips, shredded cabbage, onions, and yogurt mint dressing
ingredients:
- { item: whole-wheat atta, qty: 35, unit: g }
- { item: chicken breast, qty: 150, unit: g }
- { item: low-fat yoghurt (curd), qty: 50, unit: g }
- { item: mint leaves, qty: 0.25, unit: bunch  }
- { item: kashmiri chilli powder, qty: 1, unit: tsp }
- { item: garam masala, qty: 0.5, unit: tsp }
- { item: turmeric powder, qty: 0.5, unit: tsp }
- { item: ginger, qty: 3, unit: g   }
- { item: garlic, qty: 4, unit: g   }
- { item: lime, qty: 0.25, unit: pc   }
- { item: rice bran oil, qty: 1, unit: tsp }
- { item: cabbage, qty: 50, unit: g }
- { item: onion, qty: 0.5, unit: pc  }
- { item: black pepper, qty: 0.25, unit: tsp }
- { item: salt, qty: 0.5, unit: tsp }
steps:
- Marinate the chicken strips in half the yoghurt with kashmiri chilli, garam masala, turmeric, ginger, garlic and salt.
- Knead the atta, roll one large chapati and cook on a hot tawa.
- Pan-grill the chicken strips in the oil on high heat until cooked and lightly charred.
- Whisk the remaining yoghurt with chopped mint, lime juice, pepper and salt for the dressing.
- Shred the cabbage and slice the onion thinly.
- Lay the chicken, cabbage and onion on the chapati, spoon over the dressing and roll tightly.
source: Kerala 28-day plan (index.html, Oct 2026)
