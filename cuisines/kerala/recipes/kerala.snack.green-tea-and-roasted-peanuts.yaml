  - { item: peanuts, qty: 20, unit: g }
  - { item: salt, qty: 0.125, unit: tsp }
steps:
  - Steep the green tea bag in a cup of just-boiled water for 3 minutes, then remove the bag.
  - Dry-roast the peanuts in a pan over medium heat for 4 to 5 minutes, stirring, until they crackle.
  - Sprinkle with a little salt, rub off the skins if you like, and serve with the drink.
