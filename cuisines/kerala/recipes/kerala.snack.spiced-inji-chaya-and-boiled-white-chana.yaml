ingredients:
  - { item: black tea leaves, qty: 1, unit: tsp }
  - { item: ginger, qty: 3, unit: g  }
  - { item: cardamom pods, qty: 1, unit: pc }
  - { item: black pepper, qty: 0.125, unit: tsp }
  - { item: white chickpeas (chana), qty: 30, unit: g }
  - { item: salt, qty: 0.25, unit: tsp }
steps:
  - Crush the ginger and cardamom, boil them with the pepper in a cup of water for 2 minutes, add the tea leaves, simmer a minute and strain.
  - Reheat the pre-boiled chickpeas in a pan with a splash of water for 3 to 4 minutes.
  - Season with salt and serve warm with the drink.
