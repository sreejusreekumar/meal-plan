slot:
- lunch
role: main
cuisine: kerala
protein: chicken
spice: medium
packable: true
effort: weekday
family: chicken-curry
nutrition:
  kcal: 550
  carbs: 60
  fibre: 11
  protein: 38
  satFat: 5
  sugar: 0
components:
- 1 cup Murungayila thoran
- 1 bowl Homestyle Kerala chicken curry
- 1 level cup Matta rice
- Garlic Rasam
prepMinutes: 20
cookMinutes: 40
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: chicken (bone-in curry cut), qty: 180, unit: g }
  - { item: onion, qty: 0.5, unit: pc  }
  - { item: tomato, qty: 0.5, unit: pc  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: garlic, qty: 4, unit: g   }
  - { item: green chilli, qty: 0.5, unit: pc   }
  - { item: coriander powder, qty: 1, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.75, unit: tsp }
  - { item: garam masala, qty: 0.5, unit: tsp }
  - { item: coconut milk (canned), qty: 50, unit: ml }
  - { item: coconut oil, qty: 3, unit: tsp }
  - { item: curry leaves, qty: 4, unit: sprig }
  - { item: salt, qty: 1.5, unit: tsp }
  - { item: drumstick leaves (murungayila), qty: 0.4, unit: bunch  }
  - { item: shallots (small onions), qty: 20, unit: g }
  - { item: mustard seeds, qty: 0.75, unit: tsp }
  - { item: grated coconut, qty: 15, unit: g }
  - { item: tamarind, qty: 10, unit: g }
  - { item: black pepper, qty: 0.5, unit: tsp }
  - { item: cumin seeds, qty: 0.5, unit: tsp }
  - { item: coriander leaves, qty: 0.15, unit: bunch  }
  - { item: dried red chillies, qty: 1, unit: pc }
  - { item: asafoetida, qty: 0.1, unit: tsp }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Sauté onion, ginger, garlic, green chilli and curry leaves in coconut oil until golden; add coriander, chilli and turmeric powders and the tomato.
  - Add the chicken and salt, cook covered with a cup of water for 25 min, then stir in coconut milk and garam masala and simmer 5 min.
  - Strip and wash the leaves for the murungayila thoran; splutter mustard seeds and curry leaves in coconut oil, add shallots and green chilli, then the vegetable with turmeric and salt, cover and cook until just tender, and finish with grated coconut.
  - For the rasam, simmer tamarind water with crushed tomato, garlic, pepper, cumin, turmeric and salt (extra crushed garlic) for 10 min, temper with mustard seeds, dried chilli and asafoetida, and add coriander leaves.
  - Plate 1 level cup rice with the murungayila thoran, the chicken, and the rasam alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
