id: kerala.lunch.nadan-kozhi-roast-and-padavalanga
name: Nadan Kozhi Roast & Padavalanga
slot:
- lunch
role: main
cuisine: kerala
protein: chicken
spice: medium
packable: true
effort: weekday
family: chicken-roast
signature: true
basedOn: "Nadan kozhi roast, dry chicken roast with curry leaves and shallots."
nutrition:
  kcal: 550
  carbs: 59
  fibre: 10
  protein: 38
  satFat: 5
  sugar: 0
components:
- 1 cup Padavalanga mezhukkupuratti
- 1 portion Nadan chicken roast
- 1 level cup Matta rice
- Moru kachiyathu
prepMinutes: 20
cookMinutes: 40
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: chicken (bone-in curry cut), qty: 180, unit: g }
  - { item: shallots (small onions), qty: 20, unit: g  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: garlic, qty: 4, unit: g   }
  - { item: black pepper, qty: 1, unit: tsp }
  - { item: coriander powder, qty: 1, unit: tsp }
  - { item: garam masala, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.75, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: coconut oil, qty: 3, unit: tsp }
  - { item: curry leaves, qty: 4, unit: sprig }
  - { item: salt, qty: 1.25, unit: tsp }
  - { item: snake gourd (padavalanga), qty: 100, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc   }
  - { item: mustard seeds, qty: 0.75, unit: tsp }
  - { item: low-fat yoghurt (curd), qty: 100, unit: g }
  - { item: fenugreek seeds, qty: 0.1, unit: tsp }
  - { item: dried red chillies, qty: 1, unit: pc }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Marinate the chicken with turmeric, chilli powder, coriander powder and salt for 15 min.
  - Sauté shallots, ginger, garlic and curry leaves in coconut oil, add the chicken and cook covered 15 min, then uncover, add crushed black pepper and garam masala and roast until dry and dark.
  - Dice the vegetable finely for the padavalanga mezhukkupuratti; splutter mustard seeds in coconut oil, add shallots, garlic and green chilli, then the vegetable with turmeric and salt, and stir-fry uncovered until tender and lightly browned.
  - For the moru kachiyathu, whisk yoghurt with water and turmeric, warm gently without boiling, and temper with mustard seeds, fenugreek, shallots, ginger, green chilli, dried chilli and curry leaves.
  - Plate 1 level cup rice with the padavalanga mezhukkupuratti, the chicken, and the moru kachiyathu alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
