id: kerala.lunch.mathi-mulakittathu-and-cheera-thoran
name: Mathi Mulakittathu & Cheera Thoran
slot:
- lunch
role: main
cuisine: kerala
protein: fish
spice: medium
kidNote: Hold back the green chilli and chilli powder for the child's portion.
packable: true
effort: weekday
family: mathi
signature: true
basedOn: "Mathi mulakittathu, the everyday Kerala sardine curry soured with kudampuli."
nutrition:
  kcal: 520
  carbs: 57
  fibre: 10
  protein: 33
  satFat: 5
  sugar: 0
components:
- 1 cup Red Cheera (amaranth) thoran (minimal coconut)
- 'Primary: 2-3 Mathi (sardines) cooked in spicy Kudampuli red gravy'
- 1 level cup cooked Kerala Matta rice
- 1 glass Sambharam (salted moru with ginger/curry leaves)
swaps:
- for: Mathi
  use: Choora (Tuna) Mulakittathu
- for: Mathi
  use: Kozhuva/Netholi (Anchovy) Peera Pattichathu
prepMinutes: 20
cookMinutes: 35
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: sardines (mathi), qty: 3, unit: pc }
  - { item: kudampuli (Malabar tamarind), qty: 1, unit: pc }
  - { item: shallots (small onions), qty: 20, unit: g  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: garlic, qty: 4, unit: g   }
  - { item: chilli powder, qty: 1, unit: tsp }
  - { item: kashmiri chilli powder, qty: 0.5, unit: tsp }
  - { item: fenugreek seeds, qty: 0.25, unit: tsp }
  - { item: turmeric powder, qty: 0.5, unit: tsp }
  - { item: coconut oil, qty: 2, unit: tsp }
  - { item: curry leaves, qty: 3, unit: sprig }
  - { item: salt, qty: 1.25, unit: tsp }
  - { item: amaranth leaves (cheera), qty: 0.5, unit: bunch  }
  - { item: green chilli, qty: 0.5, unit: pc   }
  - { item: mustard seeds, qty: 0.5, unit: tsp }
  - { item: grated coconut, qty: 15, unit: g }
  - { item: low-fat yoghurt (curd), qty: 100, unit: g }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Clean the sardines; soak the kudampuli in warm water and grind the chilli powders, turmeric and a little water to a paste.
  - Heat coconut oil in a clay pot, splutter fenugreek seeds, sauté shallots, ginger, garlic and curry leaves, add the chilli paste, the kudampuli with its water and salt, then slide in the fish and simmer 12-15 min until the gravy thickens.
  - Strip and wash the leaves for the cheera thoran; splutter mustard seeds and curry leaves in coconut oil, add shallots and green chilli, then the vegetable with turmeric and salt, cover and cook until just tender, and finish with grated coconut.
  - Whisk the yoghurt with water, crushed ginger, green chilli, curry leaves and salt to make the sambharam; chill until serving.
  - Plate 1 level cup rice with the cheera thoran, the sardines, and the sambharam alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
