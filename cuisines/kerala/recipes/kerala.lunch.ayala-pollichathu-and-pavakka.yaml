id: kerala.lunch.ayala-pollichathu-and-pavakka
name: Ayala Pollichathu & Pavakka
slot:
- lunch
role: main
cuisine: kerala
protein: fish
tags:
- banana-leaf
spice: medium
packable: true
effort: weekday
family: ayala
signature: true
basedOn: "Ayala pollichathu, mackerel in banana leaf with a spicy shallot masala."
nutrition:
  kcal: 550
  carbs: 59
  fibre: 10
  protein: 34
  satFat: 5
  sugar: 0
components:
- 1 cup air-fried or pan-sautéed Pavakka chips
- 'Primary: 1 whole Ayala wrapped in banana leaf and pan-roasted'
- 1 level cup Matta rice
- Fresh Sambharam
swaps:
- for: Ayala
  use: Karimeen Pollichathu
- for: Ayala
  use: Black Avoli (Pomfret) Pollichathu
prepMinutes: 25
cookMinutes: 45
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: mackerel (ayala), qty: 1, unit: pc }
  - { item: banana leaf, qty: 1, unit: pc }
  - { item: shallots (small onions), qty: 20, unit: g  }
  - { item: tomato, qty: 0.5, unit: pc  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: garlic, qty: 4, unit: g   }
  - { item: green chilli, qty: 0.5, unit: pc   }
  - { item: chilli powder, qty: 1, unit: tsp }
  - { item: kashmiri chilli powder, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.75, unit: tsp }
  - { item: black pepper, qty: 0.5, unit: tsp }
  - { item: coconut oil, qty: 3, unit: tsp }
  - { item: curry leaves, qty: 4, unit: sprig }
  - { item: lime, qty: 0.25, unit: pc  }
  - { item: salt, qty: 1.25, unit: tsp }
  - { item: bitter gourd (pavakka), qty: 100, unit: g }
  - { item: mustard seeds, qty: 0.5, unit: tsp }
  - { item: low-fat yoghurt (curd), qty: 100, unit: g }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Score and marinate the mackerel with turmeric, chilli powder, pepper, lime juice and salt, then sear briefly on both sides in 1 tsp coconut oil.
  - Fry shallots, ginger, garlic and green chilli in the remaining oil, add tomato, chilli powders and curry leaves and cook to a thick masala.
  - Wilt the banana leaf over a flame, spread masala on it, lay the fish on top, cover with more masala, wrap, and roast the parcel on a tawa 8-10 min per side.
  - For the pavakka chips, slice bitter gourd thinly, toss with salt, turmeric, chilli powder and coconut oil, and air-fry at 200C for 12-15 min (or pan-sauté) until crisp with shallots and curry leaves.
  - Whisk the yoghurt with water, crushed ginger, green chilli, curry leaves and salt to make the sambharam; chill until serving.
  - Plate 1 level cup rice with the pavakka chips, the mackerel, and the sambharam alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
