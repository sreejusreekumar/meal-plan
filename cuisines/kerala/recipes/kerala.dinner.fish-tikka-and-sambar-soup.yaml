id: kerala.dinner.fish-tikka-and-sambar-soup
name: Fish Tikka & Sambar Soup
slot:
- dinner
role: main
cuisine: kerala
protein: fish
tags:
- no-rice
spice: medium
packable: false
effort: weekday
prepMinutes: 20
cookMinutes: 35
family: fish-fillet
nutrition:
  kcal: 490
  carbs: 40
  fibre: 10
  protein: 40
  satFat: 4
  sugar: 0
components:
- 150g grilled fish fillet cubes (Neymeen or Hamour) marinated in spices
- 1 large bowl clear drumstick vegetable sambar (no rice)
- 1 chapati
swapNote: Fish fillet can be Neymeen, Kalava, or Basa.
ingredients:
- { item: seer fish (neymeen) steak, qty: 150, unit: g }
- { item: kashmiri chilli powder, qty: 1, unit: tsp }
- { item: ginger, qty: 3, unit: g  }
- { item: garlic, qty: 4, unit: g   }
- { item: lime, qty: 0.25, unit: pc   }
- { item: black pepper, qty: 0.5, unit: tsp }
- { item: rice bran oil, qty: 1, unit: tsp }
- { item: whole-wheat atta, qty: 35, unit: g }
- { item: toor dal, qty: 30, unit: g }
- { item: drumstick (moringa pods), qty: 1, unit: pc }
- { item: ash gourd, qty: 50, unit: g }
- { item: brinjal (eggplant), qty: 50, unit: g }
- { item: tamarind, qty: 10, unit: g }
- { item: shallots (small onions), qty: 20, unit: g }
- { item: coriander powder, qty: 1, unit: tsp }
- { item: chilli powder, qty: 0.5, unit: tsp }
- { item: turmeric powder, qty: 0.5, unit: tsp }
- { item: fenugreek seeds, qty: 0.25, unit: tsp }
- { item: mustard seeds, qty: 0.5, unit: tsp }
- { item: curry leaves, qty: 1, unit: sprig }
- { item: dried red chillies, qty: 1, unit: pc }
- { item: asafoetida, qty: 0.25, unit: tsp }
- { item: coconut oil, qty: 1, unit: tsp }
- { item: salt, qty: 0.5, unit: tsp }
steps:
- Marinate the fish cubes in kashmiri chilli, turmeric, ginger, garlic, pepper, lime juice and salt.
- Pressure-cook the toor dal soft; soak the tamarind and squeeze out the pulp.
- Simmer the drumstick, ash gourd and brinjal in the tamarind water with coriander, chilli powder and turmeric until tender.
- Add the mashed dal, thin with water to a soupy consistency and simmer 5 minutes.
- Temper mustard, fenugreek, dried chilli, asafoetida, shallots and curry leaves in coconut oil and pour over the sambar.
- Knead the atta, roll one chapati and cook on the tawa.
- Pan-grill the fish cubes in the oil for 3 minutes a side and serve with the sambar soup and chapati.
source: Kerala 28-day plan (index.html, Oct 2026)
