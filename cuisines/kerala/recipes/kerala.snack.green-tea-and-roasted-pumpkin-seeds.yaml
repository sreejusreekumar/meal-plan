steps:
  - Steep the green tea bag in a cup of just-boiled water for 3 minutes, then remove the bag.
  - Dry-roast the pumpkin seeds in a pan for 2 to 3 minutes until they start to pop.
  - Sprinkle with a pinch of salt and serve with the drink.
