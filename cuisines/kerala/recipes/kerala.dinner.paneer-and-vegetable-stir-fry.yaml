id: kerala.dinner.paneer-and-vegetable-stir-fry
name: Paneer & Vegetable Stir Fry
slot:
- dinner
role: main
cuisine: kerala
protein: dairy
spice: medium
packable: false
effort: weekday
prepMinutes: 15
cookMinutes: 20
family: paneer
nutrition:
  kcal: 500
  carbs: 34
  fibre: 8
  protein: 26
  satFat: 6
  sugar: 0
components:
- 100g paneer cubes stir-fried with capsicum, French beans, and shallots
- 1 chapati
ingredients:
- { item: paneer, qty: 100, unit: g }
- { item: capsicum, qty: 0.5, unit: pc  }
- { item: french beans, qty: 100, unit: g }
- { item: shallots (small onions), qty: 20, unit: g  }
- { item: ginger, qty: 3, unit: g  }
- { item: garlic, qty: 4, unit: g   }
- { item: green chilli, qty: 0.5, unit: pc  }
- { item: black pepper, qty: 0.5, unit: tsp }
- { item: turmeric powder, qty: 0.5, unit: tsp }
- { item: chilli powder, qty: 0.5, unit: tsp }
- { item: curry leaves, qty: 1, unit: sprig }
- { item: rice bran oil, qty: 1, unit: tsp }
- { item: whole-wheat atta, qty: 35, unit: g }
- { item: salt, qty: 0.5, unit: tsp }
steps:
- Knead the atta, roll one chapati and cook on the tawa.
- Cut the paneer into cubes, the capsicum into strips and the beans into short lengths.
- Heat the oil and fry the shallots, ginger, garlic, green chilli and curry leaves until fragrant.
- Add the beans and capsicum and stir-fry 5 minutes on high heat.
- Add the paneer, turmeric, chilli powder, pepper and salt and toss 3 minutes until lightly browned.
- Serve hot with the chapati.
source: Kerala 28-day plan (index.html, Oct 2026)
