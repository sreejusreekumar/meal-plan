id: kerala.breakfast.sunday-appam-controlled-pairing
name: Sunday Appam Controlled Pairing
slot:
- breakfast
role: main
cuisine: kerala
protein: chicken
spice: medium
packable: false
effort: weekend
treat: true
refinedCarb: true
family: appam
prepMinutes: 15
cookMinutes: 30
nutrition:
  kcal: 380
  carbs: 45
  fibre: 4
  protein: 24
  satFat: 5
  sugar: 2
components:
- Strictly 2 thin Palappams (lace appams)
- 1 bowl Nadan chicken curry (eat more chicken/gravy than appam)
ingredients:
  - { item: sugar, qty: 1, unit: tsp }
  - { item: rice flour, qty: 45, unit: g }
  - { item: grated coconut, qty: 10, unit: g }
  - { item: yeast (instant), qty: 0.25, unit: tsp }
  - { item: chicken (bone-in curry cut), qty: 120, unit: g }
  - { item: shallots (small onions), qty: 20, unit: g  }
  - { item: tomato, qty: 0.5, unit: pc }
  - { item: ginger, qty: 3, unit: g  }
  - { item: garlic, qty: 4, unit: g   }
  - { item: green chilli, qty: 0.5, unit: pc  }
  - { item: curry leaves, qty: 1, unit: sprig }
  - { item: kashmiri chilli powder, qty: 1, unit: tsp }
  - { item: coriander powder, qty: 1, unit: tsp }
  - { item: turmeric powder, qty: 0.25, unit: tsp }
  - { item: garam masala, qty: 0.5, unit: tsp }
  - { item: black pepper, qty: 0.25, unit: tsp }
  - { item: mustard seeds, qty: 0.25, unit: tsp }
  - { item: coconut oil, qty: 1, unit: tsp }
  - { item: salt, qty: 0.5, unit: tsp }
steps:
  - The night before, blend the rice flour with coconut, yeast, a teaspoon of sugar, salt and water to a thin batter and leave to ferment.
  - Heat coconut oil, pop mustard seeds and curry leaves, then saute sliced shallots, ginger, garlic and green chilli until golden.
  - Add the spice powders, tomato and chicken; coat well, add a little water and simmer covered 20 minutes until the chicken is cooked and the gravy thick.
  - Swirl ladles of batter in a hot appachatti to make 2 thin lace appams; cover and cook until set.
  - Serve strictly 2 appams with the chicken curry, eating more chicken and gravy than appam.
source: Kerala 28-day plan (index.html, Oct 2026)
