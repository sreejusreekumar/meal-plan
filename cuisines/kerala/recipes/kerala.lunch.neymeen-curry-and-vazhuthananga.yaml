id: kerala.lunch.neymeen-curry-and-vazhuthananga
name: Neymeen Curry & Vazhuthananga
slot:
- lunch
role: main
cuisine: kerala
protein: fish
spice: medium
kidNote: Hold back the green chilli and chilli powder for the child's portion.
packable: true
effort: weekday
family: neymeen
signature: true
basedOn: "Meen vevichathu, the red kudampuli fish curry of Kottayam, here with seer fish."
nutrition:
  kcal: 540
  carbs: 59
  fibre: 10
  protein: 36
  satFat: 4
  sugar: 0
components:
- 1 cup Vazhuthananga (brinjal) mezhukkupuratti
- 'Primary: 1 steak Neymeen (Seer fish) in Kudampuli red gravy'
- 1 level cup Matta rice
- Thin Moru kachiyathu
swaps:
- for: Neymeen
  use: Kalava (Reef Cod/Grouper) Curry
- for: Neymeen
  use: Choora (Tuna) Vevichathu
prepMinutes: 20
cookMinutes: 35
ingredients:
  - { item: matta rice, qty: 60, unit: g }
  - { item: seer fish (neymeen) steak, qty: 150, unit: g }
  - { item: kudampuli (Malabar tamarind), qty: 1, unit: pc }
  - { item: shallots (small onions), qty: 20, unit: g  }
  - { item: ginger, qty: 3, unit: g   }
  - { item: garlic, qty: 4, unit: g   }
  - { item: chilli powder, qty: 1, unit: tsp }
  - { item: kashmiri chilli powder, qty: 0.5, unit: tsp }
  - { item: fenugreek seeds, qty: 0.35, unit: tsp }
  - { item: turmeric powder, qty: 0.75, unit: tsp }
  - { item: coconut oil, qty: 2.5, unit: tsp }
  - { item: curry leaves, qty: 3, unit: sprig }
  - { item: salt, qty: 1.25, unit: tsp }
  - { item: brinjal (eggplant), qty: 100, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc   }
  - { item: mustard seeds, qty: 0.75, unit: tsp }
  - { item: low-fat yoghurt (curd), qty: 100, unit: g }
  - { item: dried red chillies, qty: 1, unit: pc }
steps:
  - Rinse the matta rice, pressure-cook it with 3 cups water for 5 whistles (or boil 35 min) and drain.
  - Clean the seer fish steak; soak the kudampuli in warm water and grind the chilli powders, turmeric and a little water to a paste.
  - Heat coconut oil in a clay pot, splutter fenugreek seeds, sauté shallots, ginger, garlic and curry leaves, add the chilli paste, the kudampuli with its water and salt, then slide in the fish and simmer 12-15 min until the gravy thickens.
  - Dice the vegetable finely for the vazhuthananga mezhukkupuratti; splutter mustard seeds in coconut oil, add shallots, garlic and green chilli, then the vegetable with turmeric and salt, and stir-fry uncovered until tender and lightly browned.
  - For the moru kachiyathu, whisk yoghurt with water and turmeric, warm gently without boiling, and temper with mustard seeds, fenugreek, shallots, ginger, green chilli, dried chilli and curry leaves.
  - Plate 1 level cup rice with the vazhuthananga mezhukkupuratti, the seer fish steak, and the moru kachiyathu alongside.
source: Kerala 28-day plan (index.html, Oct 2026)
