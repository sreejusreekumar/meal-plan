rules:
  - title: Plate order
    text: Mallung or salad first, then fish, chicken, dhal or eggs, then one level cup of red rice last.
  - title: Walk after meals
    text: 10–15 minutes of brisk walking right after lunch and dinner.
  - title: Coconut is measured
    text: Thin coconut milk only, and no more than 1 tablespoon grated coconut per person in a sambol or mallung.
  - title: Skip completely
    text: Deep-fried short eats, kottu made with white roti, sweetened milk tea and kithul-syrup desserts.
