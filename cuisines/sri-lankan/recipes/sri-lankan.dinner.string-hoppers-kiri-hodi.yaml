id: sri-lankan.dinner.string-hoppers-kiri-hodi
name: "String Hoppers, Kiri Hodi & Boiled Egg"
slot: [dinner]
role: main
cuisine: sri-lankan
protein: egg
family: string-hoppers
spice: medium
kidNote: "Leave the green chilli and chilli flakes out of the child's portion; add them after the child's share is set aside."
packable: false
prepMinutes: 20
cookMinutes: 30
effort: weekday
treat: false
refinedCarb: false
signature: true
basedOn: "Idiyappam (string hoppers) with kiri hodi, the Sri Lankan steamed rice-noodle nests served with a thin turmeric coconut-milk gravy."
nutrition: { kcal: 495, carbs: 59, fibre: 8, protein: 28, satFat: 5, sugar: 0 }
components:
  - "Primary: 6 red-rice string hoppers with kiri hodi (thin coconut-milk gravy)"
  - "2 boiled eggs"
  - "Small bowl parippu"
  - "Cucumber-tomato salad"
ingredients:
  - { item: red rice flour, qty: 50, unit: g }
  - { item: eggs, qty: 2, unit: pc }
  - { item: coconut milk (canned), qty: 10, unit: ml }
  - { item: onion, qty: 0.25, unit: pc }
  - { item: green chilli, qty: 0.5, unit: pc }
  - { item: garlic, qty: 4, unit: g }
  - { item: fenugreek seeds, qty: 0.25, unit: tsp }
  - { item: turmeric powder, qty: 0.5, unit: tsp }
  - { item: cinnamon stick, qty: 0.25, unit: pc }
  - { item: curry leaves, qty: 2, unit: sprig }
  - { item: pandan leaf (rampe), qty: 1, unit: pc }
  - { item: maldive fish flakes, qty: 5, unit: g }
  - { item: lime, qty: 0.25, unit: pc }
  - { item: salt, qty: 1, unit: tsp }
  - { item: masoor dal, qty: 20, unit: g }
  - { item: mustard seeds, qty: 0.25, unit: tsp }
  - { item: cucumber, qty: 0.5, unit: pc }
  - { item: tomato, qty: 0.5, unit: pc }
steps:
  - "Pour just-boiled salted water into the red rice flour and knead to a soft dough; press through the string-hopper mould onto 6 small mats and steam 5 minutes."
  - "Kiri hodi: simmer the sliced onion, green chilli, garlic, fenugreek, turmeric, cinnamon, curry leaves, pandan and maldive fish in 1 cup water 10 minutes."
  - "Dilute the coconut milk with 1/4 cup water, stir in with salt and warm through without boiling; finish with lime juice."
  - "Hard-boil the eggs 10 minutes, peel and halve. Simmer the masoor dal with a pinch of turmeric and 3/4 cup water for 15 minutes with a pinch of mustard seeds and salt (no oil)."
  - "Dice the cucumber and tomato with salt. Serve the string hoppers with the kiri hodi, eggs, dhal and salad."
swaps:
  - { for: red rice flour, use: "ragi flour", note: "same method, darker nests" }
source: "Adapted from traditional Sri Lankan home cooking"
