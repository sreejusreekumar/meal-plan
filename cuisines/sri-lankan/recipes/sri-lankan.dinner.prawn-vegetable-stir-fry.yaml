nutrition: { kcal: 470, carbs: 38, fibre: 11, protein: 44, satFat: 3, sugar: 0 }
components:
  - "Primary: 140 g prawn stir-fry with capsicum, beans, cabbage and egg"
  - "1 whole-wheat roti"
