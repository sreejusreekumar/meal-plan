steps:
  - "Wash and finely shred the gotu kola; chop the onion, tomato, green chilli and curry leaves."
  - "Beat the eggs with pepper and salt and fold in the gotu kola and vegetables."
  - "Heat the rice bran oil in a small pan, pour in the egg and cook over medium heat 3 minutes, fold and cook 1 minute more."
  - "Toast the bread; brew the tea 3 minutes and strain."
  - "Serve the omelette on the toast with the tea."
