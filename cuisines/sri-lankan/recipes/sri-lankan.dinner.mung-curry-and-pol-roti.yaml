id: sri-lankan.dinner.mung-curry-and-pol-roti
name: "Mung Bean Curry & Pol Roti"
slot: [dinner]
role: main
cuisine: sri-lankan
protein: legume
family: mung
spice: medium
kidNote: "Leave the green chilli and chilli flakes out of the child's portion; add them after the child's share is set aside."
packable: false
prepMinutes: 15
cookMinutes: 35
effort: weekday
treat: false
refinedCarb: false
signature: true
basedOn: "Mung ata curry with pol roti, the Sri Lankan green-gram curry eaten with coconut flatbread."
nutrition: { kcal: 500, carbs: 58, fibre: 16, protein: 26, satFat: 4, sugar: 0 }
components:
  - "Primary: 1 bowl tempered mung (green gram) curry, no coconut milk"
  - "1 pol roti (whole-wheat, 5 g coconut)"
  - "1 boiled egg"
  - "Cucumber-tomato salad"
ingredients:
  - { item: green gram (cherupayar), qty: 50, unit: g }
  - { item: onion, qty: 0.5, unit: pc }
  - { item: garlic, qty: 4, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc }
  - { item: turmeric powder, qty: 0.5, unit: tsp }
  - { item: cumin seeds, qty: 0.25, unit: tsp }
  - { item: mustard seeds, qty: 0.25, unit: tsp }
  - { item: dried red chillies, qty: 1, unit: pc }
  - { item: curry leaves, qty: 2, unit: sprig }
  - { item: pandan leaf (rampe), qty: 1, unit: pc }
  - { item: rice bran oil, qty: 1, unit: tsp }
  - { item: salt, qty: 1, unit: tsp }
  - { item: whole-wheat atta, qty: 35, unit: g }
  - { item: grated coconut, qty: 5, unit: g }
  - { item: eggs, qty: 1, unit: pc }
  - { item: cucumber, qty: 0.5, unit: pc }
  - { item: tomato, qty: 0.5, unit: pc }
  - { item: lime, qty: 0.25, unit: pc }
steps:
  - "Soak the green gram 4 hours or overnight; pressure-cook with turmeric, pandan and 1.5 cups water for 3 whistles (or simmer 30 minutes) until soft."
  - "Temper the oil with mustard, cumin, dried chilli and curry leaves; add half the onion, the garlic and green chilli and fry until golden."
  - "Add the cooked mung with its liquid and salt; simmer 5 minutes until thick and most of the liquid is absorbed."
  - "Pol roti: mix the atta with the grated coconut, a little chopped onion and green chilli, salt and water into a soft dough; pat into one thick round and cook on a dry pan 3 minutes a side."
  - "Hard-boil the egg 10 minutes. Dice the cucumber and tomato and dress with lime and salt."
  - "Serve the salad first, then the mung curry with the pol roti and egg."
swaps:
  - { for: green gram (cherupayar), use: "black chickpeas (kadala)", note: "soak overnight; 6 whistles" }
source: "Adapted from traditional Sri Lankan home cooking"
