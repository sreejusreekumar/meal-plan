steps:
  - "Rinse the red rice, cook it in 2 cups water with a piece of pandan for 25-30 minutes until just soft, and measure 1 level cup per person."
  - "Rub the fish with turmeric and salt. Soak the tamarind in 1/4 cup warm water and squeeze out the juice."
  - "Heat the oil; fry the fenugreek, curry leaves, pandan and cinnamon 30 seconds, then the sliced onion, garlic, ginger and green chilli until soft."
  - "Add the curry powder and chilli powder, the tamarind water and 3/4 cup water; simmer 5 minutes, then lay in the fish and cook 8-10 minutes."
  - "Dilute the coconut milk with 1/2 cup water (thin milk), stir in and heat through without boiling; adjust salt."
  - "Shred the kale finely; toss in a dry pan with the grated coconut, sliced shallots, maldive fish, a pinch of turmeric and salt for 3-4 minutes until just wilted; finish with lime."
  - "Serve the mallung first, then the fish curry, with 1 level cup red rice last."
swaps:
  - { for: seer fish (neymeen) steak, use: "firm white fish fillet", note: "same timing" }
source: "Adapted from the traditional Sri Lankan rice-and-curry plate"
