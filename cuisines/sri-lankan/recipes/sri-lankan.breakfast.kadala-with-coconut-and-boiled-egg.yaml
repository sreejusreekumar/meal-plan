id: sri-lankan.breakfast.kadala-with-coconut-and-boiled-egg
name: Tempered kadala (chickpeas) with coconut & a boiled egg
slot: [breakfast]
role: main
cuisine: sri-lankan
protein: legume
family: kadala
spice: medium
kidNote: "Take out the child's portion of kadala before the chilli flakes go in."
packable: false
