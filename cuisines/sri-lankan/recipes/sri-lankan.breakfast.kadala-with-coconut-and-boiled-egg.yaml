refinedCarb: false
signature: false
nutrition: { kcal: 342, carbs: 39, fibre: 9, protein: 18, satFat: 4.8, sugar: 0 }
components:
  - "Primary: 1 bowl tempered kadala with onion, curry leaves and grated coconut"
  - "1 hard-boiled egg"
  - "Plain Ceylon tea, unsweetened"
ingredients:
  - { item: white chickpeas (chana), qty: 55, unit: g }
  - { item: grated coconut, qty: 8, unit: g }
  - { item: onion, qty: 0.5, unit: pc }
  - { item: green chilli, qty: 0.5, unit: pc }
  - { item: curry leaves, qty: 2, unit: sprig }
  - { item: mustard seeds, qty: 0.25, unit: tsp }
  - { item: turmeric powder, qty: 0.25, unit: tsp }
  - { item: chilli flakes, qty: 0.25, unit: tsp }
  - { item: rice bran oil, qty: 0.5, unit: tsp }
  - { item: eggs, qty: 1, unit: pc }
  - { item: salt, qty: 0.5, unit: tsp }
  - { item: black tea leaves, qty: 1, unit: tsp }
steps:
  - "Soak the chickpeas overnight; pressure-cook with turmeric and salt for 5-6 whistles (or boil 40 minutes) until soft, then drain."
  - "Hard-boil the egg 10 minutes, peel and halve."
  - "Heat the rice bran oil, pop the mustard seeds and curry leaves, add the sliced onion and green chilli and fry until soft."
  - "Add the chickpeas and chilli flakes, toss over high heat 3-4 minutes, then stir in the grated coconut and take off the heat."
  - "Brew the tea 3 minutes and strain; serve the kadala warm with the egg."
swaps:
  - { for: white chickpeas (chana), use: "black chickpeas (kadala)", note: cook 2 whistles longer }
source: "Adapted from the traditional Sri Lankan kadala (tempered chickpea) breakfast"
