steps:
  - "Drain and rinse the jackfruit and cut into chunks."
  - "Heat the oil; fry the cinnamon, curry leaves and pandan, then the onion, garlic and ginger until golden; add the curry powder, chilli powder and half the turmeric."
  - "Add the jackfruit, goraka, salt and 3/4 cup water; cover and simmer 20 minutes, then add the coconut milk diluted with 1/4 cup water and cook uncovered until thick and dark."
  - "Simmer the masoor dal with the remaining turmeric, green chilli, fenugreek and 3/4 cup water 15 minutes; temper with mustard seeds. Hard-boil the egg."
  - "Roti: knead the atta with salt and water, rest 10 minutes, roll one thin round and cook on a dry pan 1-2 minutes a side."
  - "Slice the cucumber and shallots with lime and salt; serve the salad first, then the curries, egg and roti."
source: "Adapted from traditional Sri Lankan home cooking"
