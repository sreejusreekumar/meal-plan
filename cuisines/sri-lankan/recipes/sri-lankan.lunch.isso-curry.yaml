ingredients:
  - { item: prawns (chemmeen), qty: 160, unit: g }
  - { item: coconut milk (canned), qty: 15, unit: ml }
  - { item: onion, qty: 0.5, unit: pc }
  - { item: garlic, qty: 4, unit: g }
  - { item: ginger, qty: 3, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc }
  - { item: sri lankan roasted curry powder, qty: 1, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.25, unit: tsp }
  - { item: fenugreek seeds, qty: 0.25, unit: tsp }
  - { item: cinnamon stick, qty: 0.25, unit: pc }
  - { item: lemongrass, qty: 0.5, unit: pc }
  - { item: curry leaves, qty: 2, unit: sprig }
  - { item: pandan leaf (rampe), qty: 1, unit: pc }
  - { item: rice bran oil, qty: 1, unit: tsp }
  - { item: salt, qty: 1, unit: tsp }
  - { item: red rice (Sri Lankan), qty: 60, unit: g }
  - { item: beetroot, qty: 1, unit: pc }
  - { item: shallots (small onions), qty: 10, unit: g }
  - { item: mustard seeds, qty: 0.25, unit: tsp }
  - { item: lime, qty: 0.25, unit: pc }
steps:
  - "Rinse the red rice, cook it in 2 cups water with a piece of pandan for 25-30 minutes until just soft, and measure 1 level cup per person."
  - "Peel and devein the prawns; rub with turmeric and salt."
  - "Heat the oil; fry the fenugreek, curry leaves, pandan, lemongrass and cinnamon, then the sliced onion, garlic, ginger and green chilli until golden."
  - "Stir in the curry powder and chilli powder, add 3/4 cup water and simmer 5 minutes; add the prawns and cook 4-5 minutes until pink."
  - "Dilute the coconut milk with 1/2 cup water, stir two-thirds of it into the prawns and warm through without boiling; finish with lime."
  - "Cut the beetroot into batons; cook with the shallots, mustard seeds, a pinch of turmeric, salt and the remaining thin milk plus 1/2 cup water for 15 minutes until tender."
  - "Serve the beetroot curry first, then the prawn curry, with 1 level cup red rice last."
swaps:
  - { for: prawns (chemmeen), use: "firm white fish fillet", note: "cube it; simmer 8 minutes" }
source: "Adapted from the traditional Sri Lankan rice-and-curry plate"
