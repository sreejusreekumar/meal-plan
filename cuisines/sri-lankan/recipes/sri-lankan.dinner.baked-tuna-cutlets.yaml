id: sri-lankan.dinner.baked-tuna-cutlets
name: "Baked Tuna Cutlets & Salad"
slot: [dinner]
role: main
cuisine: sri-lankan
protein: fish
family: cutlets
spice: medium
kidNote: "Make the child's cutlets from the mix before the green chilli and chilli flakes are added."
packable: false
prepMinutes: 25
cookMinutes: 20
effort: weekday
treat: false
refinedCarb: false
signature: false
nutrition: { kcal: 470, carbs: 38, fibre: 11, protein: 40, satFat: 3, sugar: 0 }
components:
  - "Big mixed salad (leaves, cucumber, tomato, carrot, beetroot) with lime"
  - "Primary: 4 baked tuna cutlets bound and coated with oats (no breadcrumbs, no frying)"
  - "Lime wedge"
ingredients:
  - { item: tuna (choora), qty: 110, unit: g }
  - { item: rolled oats, qty: 30, unit: g }
  - { item: eggs, qty: 1, unit: pc }
  - { item: onion, qty: 0.5, unit: pc }
  - { item: green chilli, qty: 0.5, unit: pc }
  - { item: ginger, qty: 3, unit: g }
  - { item: garlic, qty: 4, unit: g }
  - { item: curry leaves, qty: 2, unit: sprig }
  - { item: black pepper, qty: 0.5, unit: tsp }
  - { item: chilli flakes, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.25, unit: tsp }
  - { item: lime, qty: 0.5, unit: pc }
  - { item: coriander leaves, qty: 0.15, unit: bunch }
  - { item: rice bran oil, qty: 1, unit: tsp }
  - { item: salt, qty: 1, unit: tsp }
  - { item: salad leaves (mixed), qty: 50, unit: g }
  - { item: cucumber, qty: 0.5, unit: pc }
  - { item: tomato, qty: 0.5, unit: pc }
  - { item: carrot, qty: 0.5, unit: pc }
  - { item: beetroot, qty: 0.5, unit: pc }
steps:
  - "Poach the tuna 6 minutes in salted water with turmeric, drain and flake finely."
  - "Fry the chopped onion, ginger, garlic, green chilli and curry leaves in the oil 3 minutes; mix with the tuna, pepper, chilli flakes, coriander, half the lime juice and salt."
  - "Blitz two-thirds of the oats to a coarse flour and work into the mix with half the beaten egg; shape 4 cutlets."
  - "Dip the cutlets in the rest of the egg, press into the remaining whole oats and bake on a lined tray at 200 C for 18-20 minutes, turning once."
  - "Toss the salad leaves, sliced cucumber, tomato, grated carrot and beetroot with the rest of the lime and salt; serve the cutlets on top."
swaps:
  - { for: tuna (choora), use: "firm white fish fillet", note: "poach 8 minutes" }
source: "Adapted from traditional Sri Lankan home cooking"
