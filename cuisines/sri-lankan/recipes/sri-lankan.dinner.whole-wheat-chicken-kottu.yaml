id: sri-lankan.dinner.whole-wheat-chicken-kottu
name: "Whole-wheat Chicken & Egg Kottu"
slot: [dinner]
role: main
cuisine: sri-lankan
protein: chicken
family: kottu
spice: medium
kidNote: "Leave the green chilli and chilli flakes out of the child's portion; add them after the child's share is set aside."
packable: false
prepMinutes: 20
cookMinutes: 25
effort: weekend
treat: true
refinedCarb: false
signature: true
basedOn: "Kottu roti, Sri Lanka's chopped street-food roti stir-fried with egg, vegetables and curry; made here with whole-wheat roti shreds and measured oil."
nutrition: { kcal: 500, carbs: 47, fibre: 12, protein: 33, satFat: 5, sugar: 0 }
components:
  - "Primary: 1 plate kottu, whole-wheat roti shreds with chicken, egg and vegetables"
  - "Cucumber-shallot salad with lime"
ingredients:
  - { item: whole-wheat atta, qty: 50, unit: g }
  - { item: eggs, qty: 2, unit: pc }
  - { item: chicken breast, qty: 40, unit: g }
  - { item: cabbage, qty: 80, unit: g }
  - { item: onion, qty: 0.5, unit: pc }
  - { item: spring onion, qty: 0.25, unit: bunch }
  - { item: green chilli, qty: 0.5, unit: pc }
  - { item: garlic, qty: 4, unit: g }
  - { item: ginger, qty: 3, unit: g }
  - { item: curry leaves, qty: 2, unit: sprig }
  - { item: chilli flakes, qty: 0.5, unit: tsp }
  - { item: black pepper, qty: 0.25, unit: tsp }
  - { item: sri lankan roasted curry powder, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.25, unit: tsp }
  - { item: rice bran oil, qty: 1, unit: tsp }
  - { item: salt, qty: 1, unit: tsp }
  - { item: cucumber, qty: 0.5, unit: pc }
  - { item: shallots (small onions), qty: 10, unit: g }
  - { item: lime, qty: 0.25, unit: pc }
steps:
  - "Roti: knead the atta with salt and water, rest 10 minutes, roll two thin rounds and cook on a dry pan 1-2 minutes a side."
  - "Cool the rotis and cut into thin ribbons. Dice the chicken small and toss with turmeric, curry powder and salt."
  - "Heat the oil on a wide griddle; cook the chicken 3 minutes, then add the onion, garlic, ginger, green chilli and curry leaves 2 minutes."
  - "Push aside, crack in the eggs and scramble; add the shredded cabbage and spring onion and toss 2 minutes."
  - "Add the roti ribbons, chilli flakes and pepper with 2 tbsp water and chop-toss with two spatulas for 2-3 minutes until everything is mixed and steaming."
  - "Slice the cucumber and shallots and dress with lime and salt; serve beside the kottu."
source: "Adapted from traditional Sri Lankan home cooking"
