nutrition: { kcal: 550, carbs: 52, fibre: 12, protein: 34, satFat: 5, sugar: 0 }
components:
  - "Kale mallung"
  - "Primary: 3 sardines in hurulla-style curry (goraka, no coconut milk)"
  - "Ash gourd curry"
  - "1 level cup red rice"
ingredients:
  - { item: sardines (mathi), qty: 3, unit: pc }
  - { item: kudampuli (Malabar tamarind), qty: 1, unit: pc }
  - { item: onion, qty: 0.25, unit: pc }
  - { item: garlic, qty: 4, unit: g }
  - { item: ginger, qty: 3, unit: g }
  - { item: green chilli, qty: 0.5, unit: pc }
  - { item: sri lankan roasted curry powder, qty: 1, unit: tsp }
  - { item: chilli powder, qty: 0.5, unit: tsp }
  - { item: turmeric powder, qty: 0.5, unit: tsp }
  - { item: fenugreek seeds, qty: 0.25, unit: tsp }
  - { item: curry leaves, qty: 2, unit: sprig }
  - { item: pandan leaf (rampe), qty: 1, unit: pc }
  - { item: rice bran oil, qty: 1, unit: tsp }
  - { item: salt, qty: 1, unit: tsp }
  - { item: red rice (Sri Lankan), qty: 60, unit: g }
  - { item: kale, qty: 0.5, unit: bunch }
  - { item: grated coconut, qty: 5, unit: g }
  - { item: shallots (small onions), qty: 10, unit: g }
  - { item: maldive fish flakes, qty: 3, unit: g }
  - { item: lime, qty: 0.25, unit: pc }
  - { item: ash gourd, qty: 100, unit: g }
  - { item: mustard seeds, qty: 0.25, unit: tsp }
steps:
  - "Rinse the red rice, cook it in 2 cups water with a piece of pandan for 25-30 minutes until just soft, and measure 1 level cup per person."
  - "Clean the sardines, score the skin and rub with turmeric and salt. Soak the goraka in 1/4 cup hot water."
  - "Heat the oil; fry the fenugreek, curry leaves and pandan, then the onion, garlic, ginger and green chilli until soft; add the curry and chilli powders."
  - "Add the goraka with its water and 1/2 cup water, simmer 5 minutes, lay in the sardines and cook 8 minutes without stirring."
  - "Shred the kale; toss in a dry pan with the grated coconut, shallots, maldive fish and a pinch of turmeric until wilted; finish with lime."
  - "Simmer the diced ash gourd with mustard seeds, turmeric and salt in 1/2 cup water for 10 minutes."
  - "Serve the mallung first, then the sardines and ash gourd, with 1 level cup red rice last."
swaps:
  - { for: sardines (mathi), use: "mackerel (ayala)", note: "1 pc cut into 3" }
source: "Adapted from the traditional Sri Lankan rice-and-curry plate"
