id: sri-lankan.snack.ceylon-tea-and-tempered-kadala
name: Plain Ceylon tea & tempered kadala with chilli flakes and curry leaves
slot: [snack]
role: main
cuisine: sri-lankan
protein: legume
family: kadala
spice: mild
kidNote: "Scoop out the child's chickpeas before the chilli flakes go in."
packable: false
prepMinutes: 5
cookMinutes: 10
effort: weekday
treat: false
refinedCarb: false
signature: true
basedOn: "Kadala thel dala, the tempered chickpeas sold in paper cones at Sri Lankan bus stands and beaches, here with plain tea."
nutrition: { kcal: 129, carbs: 18, fibre: 4, protein: 6, satFat: 0.7, sugar: 0 }
components:
  - "Primary: 1/3 cup tempered kadala (chickpeas, curry leaves, chilli flakes)"
  - "Plain Ceylon tea, unsweetened"
ingredients:
  - { item: white chickpeas (chana), qty: 30, unit: g }
  - { item: rice bran oil, qty: 0.5, unit: tsp }
  - { item: mustard seeds, qty: 0.25, unit: tsp }
  - { item: curry leaves, qty: 1, unit: sprig }
  - { item: chilli flakes, qty: 0.25, unit: tsp }
  - { item: lime, qty: 0.25, unit: pc }
  - { item: salt, qty: 0.125, unit: tsp }
  - { item: black tea leaves, qty: 1, unit: tsp }
steps:
  - "Use chickpeas soaked and boiled ahead with the week's batch (30 g dry makes about 1/3 cup cooked); drain them well."
  - "Heat the rice bran oil, pop the mustard seeds and curry leaves, add the chickpeas and chilli flakes and toss over high heat 4-5 minutes until the skins blister."
  - "Season with salt and a squeeze of lime."
  - "Brew the tea leaves in a cup of boiling water 3 minutes and strain; serve black and unsweetened."
source: "Adapted from the Sri Lankan street snack kadala thel dala"
