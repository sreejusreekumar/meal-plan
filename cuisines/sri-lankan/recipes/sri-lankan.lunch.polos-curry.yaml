steps:
  - "Rinse the red rice, cook it in 2 cups water with a piece of pandan for 25-30 minutes until just soft, and measure 1 level cup per person."
  - "Drain and rinse the jackfruit; cut into bite-size chunks."
  - "Heat the oil; fry the cinnamon, curry leaves and pandan, then the onion, garlic and ginger until golden; add the curry powder, chilli powder and half the turmeric."
  - "Add the jackfruit, goraka, salt and 1 cup water; cover and simmer 25 minutes, then stir in the coconut milk diluted with 1/4 cup water and cook uncovered until the gravy is thick and dark."
  - "Simmer the masoor dal with the remaining turmeric, green chilli, fenugreek and 1 cup water for 15 minutes; temper with mustard seeds."
  - "Shred the cabbage finely; toss in a dry pan with the grated coconut, shallots, a pinch of turmeric and salt until just wilted; finish with lime."
  - "Serve the mallung first, then the polos curry and dhal, with 1 level cup red rice last."
source: "Adapted from the traditional Sri Lankan rice-and-curry plate"
