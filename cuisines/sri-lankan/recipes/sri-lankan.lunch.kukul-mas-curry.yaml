steps:
  - "Rinse the red rice, cook it in 2 cups water with a piece of pandan for 25-30 minutes until just soft, and measure 1 level cup per person."
  - "Skin the chicken pieces and marinate 15 minutes with the curry powder, chilli powder, turmeric and salt."
  - "Heat the oil; fry the fenugreek, cardamom, cloves, cinnamon, lemongrass, curry leaves and pandan, then the onion, garlic, ginger and green chilli until golden."
  - "Add the chicken and sear 5 minutes, add 1 cup water, cover and simmer 25 minutes until tender and the gravy has reduced."
  - "Dilute the coconut milk with 1/2 cup water, stir in and heat through gently."
  - "Cut the snake beans into 2 cm lengths; cook with mustard seeds, shallots, maldive fish, a pinch of turmeric and salt in 1/4 cup water for 8 minutes, uncovered at the end."
  - "Serve the bean curry first, then the chicken curry, with 1 level cup red rice last."
swaps:
