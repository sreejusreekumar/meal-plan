[project]
name = "mealplan"
version = "0.1.0"
description = "Deterministic weekly family meal planner: cuisine packs -> plan -> shopping list -> static page"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13",
]

[project.scripts]
mealplan = "mealplan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mealplan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
