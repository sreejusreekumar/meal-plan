# Canonical ingredient catalogue. Every recipe ingredient must use one of these exact `item`
# names and the item's `unit`, so the shopping list merges cleanly across recipes and cuisines.
#
# aisle: produce | fish | meat | dairy | grains | pantry | spices | frozen | other
# unit:  g | ml | pc | tsp | tbsp | sprig | bunch
# staple: true = assumed in the pantry; listed under "Check pantry", not under "Buy".
# packSize: round the week's total up to a multiple of this when buying (optional).

aisleOrder: [produce, fish, meat, dairy, grains, pantry, spices, frozen, other]

items:
