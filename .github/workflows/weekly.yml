name: Weekly plan

# Keeps the week in progress AND the week after it planned and published, and the page fresh.
# GitHub cron is UTC, has no DST, and scheduled runs start hours late or get dropped, so nothing
# here depends on a run starting at a particular time. Every scheduled run is idempotent: for
# both weeks it plans the week only if that plan is missing, rewrites the shopping list, rebuilds
# index.html, and commits only if something changed. Both weeks come from the Melbourne date
# when the run actually starts, so the first run after the Monday rollover plans the new "next"
# week and flips the manifest's current/next.
# The manual button (workflow_dispatch) plans the single week given in its inputs instead.
on:
  schedule:
    - cron: "0 19 * * 5"   # Sat 06:00 AEDT
    - cron: "0 20 * * 5"   # Sat 06:00 AEST
    - cron: "0 2 * * 6"    # Sat ~midday: catch-up
    - cron: "0 9 * * 6"    # Sat evening: catch-up
    - cron: "0 22 * * 6"   # Sun morning: catch-up
    - cron: "0 14 * * 0"   # Mon ~00:00-01:00: rollover rebuild
    - cron: "0 20 * * 0"   # Mon morning: rollover rebuild, second chance
  workflow_dispatch:
    inputs:
      week:
        description: "Week to plan: next | this | YYYY-Www"
        default: "next"
      cuisine:
        description: "Pack id(s), comma-separated. Empty = config/rotation.yaml"
        default: ""
      salt:
        description: "Reroll knob (integer)"
        default: "0"
      force:
        description: "Replace an existing plan for that week"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Pick this week and next week from the Melbourne date (scheduled runs)
        id: target
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Australia/Melbourne")).date()
          weeks = []
          for ahead in (0, 7):   # the week in progress first: it is history for the next one
              year, week, _ = (today + timedelta(days=ahead)).isocalendar()
              weeks.append(f"{year}-W{week:02d}")
          print(f"melbourne={today:%F}")
          print(f"weeks={' '.join(weeks)}")
          PY

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-groups

      - name: Plan, shop, build
        env:
          WEEKS: ${{ steps.target.outputs.weeks || github.event.inputs.week || 'next' }}
          CUISINE: ${{ github.event.inputs.cuisine }}
          SALT: ${{ github.event.inputs.salt || '0' }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          for week in $WEEKS; do
            args=(--week "$week" --salt "$SALT")
            [ -n "$CUISINE" ] && args+=(--cuisine "$CUISINE")
            [ "$FORCE" = "true" ] && args+=(--force)
            uv run mealplan weekly "${args[@]}"
          done
          uv run mealplan validate
          uv run mealplan build --check

      - name: Commit and push
        run: |
          git config user.name "meal-plan bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A plans shopping index.html
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          new=$(git diff --cached --name-only --diff-filter=A -- plans | sed -n 's|^plans/\(.*\)\.json$|\1|p' | paste -sd' ' -)
          if [ -n "$new" ]; then msg="Plan ${new} [auto]"; else msg="Rebuild page [auto]"; fi
          git commit -m "$msg"
          git push
